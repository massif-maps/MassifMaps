name: Build SWIG
description: Clone mobile-swig, build it (with cache), and output the swig binary path

outputs:
  swig-path:
    description: Path to the compiled swig binary
    value: ${{ steps.vars.outputs.swig-path }}

runs:
  using: composite
  steps:
    - name: Get mobile-swig HEAD SHA
      id: swig-sha
      shell: bash
      run: |
        SHA=$(git ls-remote https://github.com//massif-maps/mobile-swig.git HEAD | awk '{print $1}')
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "SWIG_CACHE_KEY=mobile-swig-${{ runner.os }}-${SHA}" >> "$GITHUB_ENV"

    - name: Cache SWIG binary
      id: cache-swig
      uses: actions/cache@v4
      with:
        path: |
          mobile-swig
        key: mobile-swig-${{ runner.os }}-${{ steps.swig-sha.outputs.sha }}

    - name: Clone and build mobile-swig
      if: steps.cache-swig.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get install -y --no-install-recommends autoconf automake libtool build-essential
        fi
        # Clone with retry
        for attempt in 1 2 3; do
          if git clone --depth=1 https://github.com//massif-maps/mobile-swig.git; then
            break
          fi
          echo "Clone attempt $attempt failed, retrying in 10s..."
          sleep 10
          if [ "$attempt" -eq 3 ]; then echo "All clone attempts failed"; exit 1; fi
        done
        cd mobile-swig
        if [ "$RUNNER_OS" = "macOS" ]; then
          brew install autoconf automake libtool
          export PATH="$(brew --prefix autoconf)/bin:$(brew --prefix automake)/bin:$(brew --prefix libtool)/bin:$PATH"
        fi

        echo "PATH=$PATH"
        echo "autoconf: $(command -v autoconf)"
        echo "automake: $(command -v automake)"
        echo "aclocal: $(command -v aclocal)"
        echo "libtoolize: $(command -v glibtoolize || command -v libtoolize)"
        echo
        autoconf --version
        automake --version
        aclocal --version

        # Download PCRE2 with retry
        PCRE2_URL="https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz"
        for attempt in 1 2 3; do
          if curl --retry 5 --retry-delay 10 --retry-connrefused -fsSL -o pcre2-10.44.tar.gz "$PCRE2_URL"; then
            break
          fi
          echo "PCRE2 download attempt $attempt failed, retrying..."
          sleep 10
          if [ "$attempt" -eq 3 ]; then echo "All PCRE2 download attempts failed"; exit 1; fi
        done
        ./Tools/pcre-build.sh
        ./autogen.sh
        ./configure
        make

    - name: Set swig-path output
      id: vars
      shell: bash
      run: echo "swig-path=${{ github.workspace }}/mobile-swig/swig" >> "$GITHUB_OUTPUT"
