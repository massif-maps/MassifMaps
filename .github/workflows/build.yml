name: Build MassifMaps 
permissions:
  contents: write

on: 
  workflow_dispatch:
    inputs:
      version:
       required: false
       description: 'version number'
      publish:
        description: "Should we publish on Github?"
        default: true
        required: true
        type: boolean

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set.outputs.variants }}
      profiles: ${{ steps.set.outputs.profiles }}
    steps:
      - id: set
        run: |
          echo 'variants=["android","ios"]' >> $GITHUB_OUTPUT
          # 'full+gdal' is the only profile with a dependency the runner has to cross-build first
          # (see the cross-build step). getVariant() turns it into 'full_gdal', so it carries no
          # '+' into an artifact name, a cache key or a jitpack/Package.swift entry.
          echo 'profiles=["full","standard", "lite", "full+gdal"]' >> $GITHUB_OUTPUT

  api-bindings:
    # The facade's generated bindings - the typings an integration actually reads. The C++ property
    # table is generated by CMake on every build and cannot drift; these are not, and they did. This
    # job fails when a class added to all/modules never reached the TypeScript typing, the
    # Objective-C constants or the C enum ids, and ships them as a release asset so NativeScript,
    # React Native and a WASM or dart:ffi binding can fetch them per version instead of vendoring a
    # copy that silently ages.
    runs-on: ubuntu-latest
    needs: [create-release]
    # create-release is skipped when not publishing; the drift check still has to run.
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check the generated API bindings are up to date
        run: ./scripts/gen-api-bindings.sh --check

      - name: Package
        run: |
          mkdir -p dist/api-bindings
          cp docs/api/massif-api.json                        dist/api-bindings/
          cp bindings/typescript/massif.d.ts                 dist/api-bindings/
          cp ios/objc/api/MassifApiNames.h                   dist/api-bindings/
          cp ios/objc/api/MassifApiNames.m                   dist/api-bindings/
          cp android/java/com/massifmaps/api/ApiNames.java   dist/api-bindings/
          cp all/native/api/massif_api_names.h               dist/api-bindings/
          cp all/native/api/massif_api_names.c               dist/api-bindings/
          cp all/native/api/MassifApiC.h                     dist/api-bindings/
          (cd dist && zip -r massif-api-bindings.zip api-bindings)

      - name: Upload Release Asset
        if: github.event.inputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The schema and the typing go up LOOSE as well as in the zip: an integration that
          # generates its own bindings (NativeScript reads massif-api.json and emits its typings
          # from it) should fetch one file over https, not unpack an archive to reach it.
          gh release upload ${{ needs.create-release.outputs.VERSION_TAG }} \
            dist/massif-api-bindings.zip \
            docs/api/massif-api.json \
            bindings/typescript/massif.d.ts

      - uses: actions/upload-artifact@v4
        if: github.event.inputs.publish != 'true'
        with:
          name: massif-api-bindings
          path: dist/api-bindings

  create-release:
    runs-on: ubuntu-latest
    if: github.event.inputs.publish == 'true'
    outputs:
      RELEASE_UPLOAD_ID: ${{ steps.create_release.outputs.id }}
      VERSION: ${{ steps.get_version_or_prompt.outputs.result }}
      VERSION_TAG: v${{ steps.get_version_or_prompt.outputs.result }}
    steps:
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: actions/github-script@v9
        id: get_version_or_prompt
        with:
          result-encoding: string
          script: |
            if ("${{ github.event.inputs.version }}".length) {
             return "${{ github.event.inputs.version }}".replace(/^v/, '');
            }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and push release tag
        run: |
          TAG="v${{ steps.get_version_or_prompt.outputs.result }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping creation."
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: create release
        id: create_release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # This pulls from the "Get Changelog Entry" step above, referencing it's ID to get its outputs object.
          # See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          tag:  v${{ steps.get_version_or_prompt.outputs.result }}
          name: v${{ steps.get_version_or_prompt.outputs.result }}
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  release-preflight:
    runs-on: ubuntu-latest
    needs: [create-release]
    if: github.event.inputs.publish == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure release tag exists
        run: |
          git fetch --tags --force
          TAG="${{ needs.create-release.outputs.VERSION_TAG }}"
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || {
            echo "::error::Release tag ${TAG} was not found after create-release."
            exit 1
          }

      - name: Ensure release tag is latest tag
        uses: actions/github-script@v9
        env:
          EXPECTED_TAG: ${{ needs.create-release.outputs.VERSION_TAG }}
        with:
          script: |
            const expected = process.env.EXPECTED_TAG
            const { owner, repo } = context.repo
            let latest = null
            for await (const page of github.paginate.iterator(github.rest.repos.listTags, { owner, repo, per_page: 100 })) {
              const match = page.data.find(t => /^v\d/.test(t.name))
              if (match) { latest = match.name; break }
            }
            if (!latest) {
              core.setFailed(`No well-formed tags found while validating expected tag ${expected}.`)
              return
            }
            core.info(`Latest well-formed tag from API: ${latest}`)
            if (latest !== expected) {
              core.setFailed(`Expected latest tag ${expected}, but latest is ${latest}.`)
            }

      - name: Validate changelog generation preflight
        uses: requarks/changelog-action@v1
        with:
          useGitmojis: false
          excludeTypes: build,docs,other,style,chore,perf,doc
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.create-release.outputs.VERSION_TAG }}
          writeToFile: false

  build:
    permissions:
      contents: write
    strategy:
      matrix:
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}
        profile: ${{ fromJson(needs.prepare.outputs.profiles) }}
        exclude:
          # iOS + GDAL is NOT wired yet. The xcframework is five slices (device, simulator on two
          # architectures, and two Catalyst ones) and each needs its own cross-built GDAL. The
          # Android cross-build script has no iOS counterpart yet, so there is nothing that would
          # produce a linkable library for all five. Android is complete.
          - variant: ios
            profile: full+gdal
    runs-on: ${{ matrix.variant == 'android' && 'ubuntu-latest' || 'macos-latest' }}
    needs: [create-release, prepare, release-preflight]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') && (needs.release-preflight.result == 'success' || needs.release-preflight.result == 'skipped')
    name: "MassifMaps ${{ matrix.variant }} - Profile: ${{ matrix.profile }}"
    steps:
      - name: Runner platform name
        run: |
            export PLATFORM_UP=${{ runner.os }}
            echo "PLATFORM_UP=$PLATFORM_UP"
            echo "PLATFORM=$(echo "$PLATFORM_UP" | tr "[:upper:]" "[:lower:]")" >>${GITHUB_ENV}
            echo "PLATFORM=${{ env.PLATFORM }}"

      - uses: actions/checkout@v7
        with: 
          fetch-depth: 1

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        if: matrix.variant == 'ios'
        with:
          xcode-version: latest-stable

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
      
      - name: Setup JDK
        uses: actions/setup-java@v5
        if: matrix.variant == 'android'
        with:
          java-version: 17
          distribution: 'temurin'
      
      - name: Setup Android SDK
        if: matrix.variant == 'android'
        uses: android-actions/setup-android@v4

      # - if: matrix.variant == 'android'
      #   name: run SDKManager
      #   run:  sdkmanager "build-tools;30.0.3"

      - uses: nttld/setup-ndk@v1.6.0
        if: matrix.variant == 'android'
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: true
          link-to-sdk: true
          local-cache: true

      # TODO revisit after some updates of nttld/setup-ndk
      - name: Restore Android Symlinks
        if: matrix.variant == 'android'
        run: |
          directory="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          find "$directory" -type l | while read link; do
              current_target=$(readlink "$link")
              new_target="$directory/$(basename "$current_target")"
              ln -sf "$new_target" "$link"
              echo "Changed $(basename "$link") from $current_target to $new_target"
          done
      
      - name: Setup Gradle
        if: matrix.variant == 'android'
        uses: gradle/actions/setup-gradle@v4
        with: 
          gradle-version: "8.14.3"

      - name: Cache Maven local repository
        if: matrix.variant == 'android'
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/settings.gradle*') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
          check-latest: false

      - name: Cache apt packages
        if: matrix.variant == 'android'
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-autoconf-automake-libtool-build-essential

      - name: Install build tools (Android)
        if: matrix.variant == 'android'
        run: |
          sudo apt-get install -y autoconf automake libtool build-essential

      - name: Install build tools (iOS)
        if: matrix.variant == 'ios'
        run: |
          brew install autoconf automake libtool

      - name: ensure dist
        run: |
          mkdir -p dist

      - name: fetch externals
        run: |
          git submodule update --init --remote --recursive

      - name: Prepare Boost
        uses: ./.github/actions/prepare-boost

      - name: Setup ccache
        uses: actions/cache@v6
        with:
          path: |
            ~/.ccache
            ~/Library/Caches/ccache
          key: ccache-${{ matrix.variant }}-${{ matrix.profile }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.variant }}-${{ matrix.profile }}-

      - name: Build SWIG
        id: swig
        uses: ./.github/actions/build-swig

      - name: Build CSS2XML
        if: matrix.profile == 'lite'
        run: |
          cd libs-massif/cartocss/util
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cd build
          make css2xml
          mv css2xml css2xml_${{ env.PLATFORM }}
          zip ../../../../dist/css2xml_${{ env.PLATFORM }}.zip css2xml_${{ env.PLATFORM }}

      - name: Build swig-objc
        if: matrix.variant == 'ios'
        run: |
          cd scripts
          python swigpp-objc.py --profile ${{ matrix.profile }} --swig ${{ steps.swig.outputs.swig-path }}

      - name: Build swig-java
        if: matrix.variant == 'android'
        run: |
          cd scripts
          python swigpp-java.py --profile ${{ matrix.profile }} --swig ${{ steps.swig.outputs.swig-path }}

      # The 'gdal' profile needs one CROSS-BUILT GDAL PER ABI. A host package (apt libgdal-dev)
      # is x86_64 Linux and cannot be linked into an Android .so, so this cross-builds GDAL and
      # PROJ with the NDK instead. No submodule and nothing in libs-external - the SDK only ever
      # sees an install prefix, through find_package(GDAL).
      #
      # The first run builds all of it four times over and is SLOW. The cache below is what makes
      # every run after it cheap; do not remove it.
      - name: Cache cross-built GDAL
        if: matrix.variant == 'android' && matrix.profile == 'full+gdal'
        id: gdal-cache
        uses: actions/cache@v6
        with:
          path: build/gdal
          key: gdal-android-${{ hashFiles('scripts/build-gdal-android.py') }}

      # PROJ's build RUNS a host sqlite3 to generate proj.db. This one is host tooling, never
      # linked into the SDK - that is the only thing an apt package is good for here.
      - name: Install host sqlite3
        if: matrix.variant == 'android' && matrix.profile == 'full+gdal' && steps.gdal-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Cross-build GDAL for every Android ABI
        if: matrix.variant == 'android' && matrix.profile == 'full+gdal' && steps.gdal-cache.outputs.cache-hit != 'true'
        run: python scripts/build-gdal-android.py --ndk "${{ steps.setup-ndk.outputs.ndk-path }}"

      - name: Build Massif for Android
        if: matrix.variant == 'android'
        run: |
          cd scripts
          python build-android.py --profile ${{ matrix.profile }} --build-aar --build-version ${{ github.event.inputs.version }} --configuration=Release ${{ matrix.profile == 'full+gdal' && '--cmake-options "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/build/gdal/{abi}"' || '' }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build Massif for IOS
        if: matrix.variant == 'ios'
        run: |
          cd scripts
          python build-ios.py --profile ${{ matrix.profile }} --build-version ${{ github.event.inputs.version }} --configuration=Release --build-xcframework --use-metalangle
      - name: Upload Release Asset
        if: github.event.inputs.publish == 'true' && matrix.profile == 'lite'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.VERSION_TAG }} dist/css2xml_*.zip

      - name: Upload Release Asset
        if: github.event.inputs.publish == 'true' && matrix.variant == 'android'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/android
          gh release upload ${{ needs.create-release.outputs.VERSION_TAG }} dist/android/*.aar
      
      - name: Upload Release Asset
        if: github.event.inputs.publish == 'true' && matrix.variant == 'ios'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.VERSION_TAG }} dist/ios_metal/*.zip

      - uses: actions/upload-artifact@v4
        if: github.event.inputs.publish != 'true' && matrix.variant == 'ios'
        with:
          name:  Massif-ios-${{matrix.variant}}-${{ matrix.profile }}
          path: |
            dist/ios_metal/*.zip
          retention-days: 7
          if-no-files-found: error

      - name: Write checksum JSON
        if: github.event.inputs.publish == 'true' && matrix.variant == 'ios'
        run: |
          SHA=$(sha256sum dist/ios_metal/*.zip | awk '{print $1}')
          printf '{"%s":"%s"}\n' "${{ matrix.profile }}" "$SHA" > dist/checksum-${{ matrix.profile }}.json

      - uses: actions/upload-artifact@v4
        if: github.event.inputs.publish == 'true' && matrix.variant == 'ios'
        with:
          name: ios-checksum-${{ matrix.profile }}
          path: dist/checksum-${{ matrix.profile }}.json


      - uses: actions/upload-artifact@v4
        if: github.event.inputs.publish != 'true' && matrix.variant == 'android'
        with:
          name:  Massif-android-${{matrix.variant}}-${{ matrix.profile }}
          path: |
            dist/android/*android*.aar
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: github.event.inputs.publish != 'true' && matrix.profile == 'lite'
        with:
          name:  Massif-${{matrix.variant}}-${{ matrix.profile }}-css2xml
          path: |
            dist/css2xml_*.zip
          retention-days: 7
          if-no-files-found: error
  
  build-routing:
    permissions:
      contents: write
    strategy:
      matrix:
        variant: ["android", "ios"]
    runs-on: ${{ matrix.variant == 'android' && 'ubuntu-latest' || 'macos-latest' }}
    needs: [create-release, prepare, release-preflight]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') && (needs.release-preflight.result == 'success' || needs.release-preflight.result == 'skipped')
    name: "ValhallaRouting ${{ matrix.variant }}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: maxim-lobanov/setup-xcode@7f352e61cbe8130c957c3bc898c4fb025784ea1e
        if: matrix.variant == 'ios'
        with:
          xcode-version: latest-stable

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Setup JDK
        uses: actions/setup-java@v5
        if: matrix.variant == 'android'
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Android SDK
        if: matrix.variant == 'android'
        uses: android-actions/setup-android@v4

      - uses: nttld/setup-ndk@v1.6.0
        if: matrix.variant == 'android'
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: true
          link-to-sdk: true
          local-cache: true

      - name: Restore Android Symlinks
        if: matrix.variant == 'android'
        run: |
          directory="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          find "$directory" -type l | while read link; do
              current_target=$(readlink "$link")
              new_target="$directory/$(basename "$current_target")"
              ln -sf "$new_target" "$link"
              echo "Changed $(basename "$link") from $current_target to $new_target"
          done

      - name: Setup Gradle
        if: matrix.variant == 'android'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Cache Maven local repository
        if: matrix.variant == 'android'
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/settings.gradle*') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
          check-latest: false

      - name: Cache apt packages
        if: matrix.variant == 'android'
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-autoconf-automake-libtool-build-essential

      - name: Install build tools (Android)
        if: matrix.variant == 'android'
        run: |
          sudo apt-get install -y autoconf automake libtool build-essential

      - name: Cache Homebrew packages
        if: matrix.variant == 'ios'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/autoconf
            /usr/local/Cellar/automake
            /usr/local/Cellar/libtool
            /opt/homebrew/Cellar/autoconf
            /opt/homebrew/Cellar/automake
            /opt/homebrew/Cellar/libtool
          key: brew-${{ runner.os }}-autoconf-automake-libtool

      - name: Install build tools (iOS)
        if: matrix.variant == 'ios'
        run: |
          brew install autoconf automake libtool

      - name: ensure dist
        run: mkdir -p dist

      - name: fetch externals
        run: |
          git submodule update --init --remote --recursive

      - name: Prepare Boost
        uses: ./.github/actions/prepare-boost

      - name: Setup ccache
        uses: actions/cache@v6
        with:
          path: |
            ~/.ccache
            ~/Library/Caches/ccache
          key: ccache-${{ matrix.variant }}-routing-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.variant }}-routing-

      - name: Build ValhallaRouting for Android
        if: matrix.variant == 'android'
        run: |
          cd scripts
          python build-routing-android.py --build-version ${{ github.event.inputs.version }} --configuration=Release
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build ValhallaRouting for iOS
        if: matrix.variant == 'ios'
        run: |
          cd scripts
          python build-routing-ios.py --build-version ${{ github.event.inputs.version }} --build-xcframework --configuration=Release

      - name: Upload routing release asset (Android)
        if: github.event.inputs.publish == 'true' && matrix.variant == 'android'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.VERSION_TAG }} dist/routing-android/*.aar

      - name: Upload routing release asset (iOS)
        if: github.event.inputs.publish == 'true' && matrix.variant == 'ios'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.VERSION_TAG }} dist/routing-ios/*.zip

      - name: Write routing checksum JSON (iOS)
        if: github.event.inputs.publish == 'true' && matrix.variant == 'ios'
        run: |
          SHA=$(sha256sum dist/routing-ios/*.zip | awk '{print $1}')
          printf '{"routing":"%s"}\n' "$SHA" > dist/routing-checksum.json

      - uses: actions/upload-artifact@v4
        if: github.event.inputs.publish == 'true' && matrix.variant == 'ios'
        with:
          name: routing-checksum
          path: dist/routing-checksum.json

      - uses: actions/upload-artifact@v4
        if: github.event.inputs.publish != 'true' && matrix.variant == 'ios'
        with:
          name: ValhallaRouting-ios
          path: dist/routing-ios/*.zip
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: github.event.inputs.publish != 'true' && matrix.variant == 'android'
        with:
          name: ValhallaRouting-android
          path: dist/routing-android/*.aar
          retention-days: 7
          if-no-files-found: error

  create-jitpack-swiftpackage-release:
    runs-on: ubuntu-latest
    needs: [prepare, build, build-routing]
    if: github.event.inputs.publish == 'true'
    permissions:
      contents: write # release changes require contents write
    steps:
      - uses: actions/checkout@v7
        with: 
          fetch-depth: 1
          lfs: false
          submodules: false
          clean: true

      - uses: oleksiyrudenko/gha-git-credentials@v2.1.1
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          global: true
          actor: farfromrefug
          name: Martin Guillon
          email: dev@akylas.fr

      - name: Checkout mobile-sdk-android-aar
        uses: actions/checkout@v7
        with:
          repository: massif-maps/MassifMaps-android-aar
          token: '${{ secrets.AAR_SWIFT_TOKEN }}'
          path: mobile-sdk-android-aar

      - name: Generate jitpack.yml then publish/tag
        run: |
          PROFILES_CSV=$(echo '${{ needs.prepare.outputs.profiles }}' | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin)))')
          python ./scripts/generate-jitpack.py --version ${{ github.event.inputs.version }} --profiles $PROFILES_CSV
          cd mobile-sdk-android-aar
          mv -f ../dist/android/jitpack.yml ./
          git add jitpack.yml
          git commit -m "Automated update jitpack.yml for version ${{ github.event.inputs.version }} and profile $PROFILES_CSV"
          git push origin main
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}
      
      - name: Download ios checksum artifacts
        uses: actions/download-artifact@v4
        with:
          path: ios-checksums

      - name: Download only ios-checksum artifacts (no zips/aar)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p ios-checksums
          echo "Listing artifacts for run $RUN_ID in $REPO"
          artifacts_json=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100")
          echo "Got artifacts for run $RUN_ID in $REPO"
          # Filter artifact list to ios-checksum-* entries
          echo "$artifacts_json" | python3 -c '
          import json,sys
          data = json.load(sys.stdin)
          artifacts = data.get("artifacts", [])
          out = []
          for a in artifacts:
              name = a.get("name","")
              if name.startswith("ios-checksum-"):
                  out.append({"name": name, "id": a.get("id"), "url": a.get("archive_download_url")})
          print(json.dumps(out))
          ' > /tmp/ios_checks_list.json

          count=$(jq 'length' /tmp/ios_checks_list.json)
          echo "Got checksums in /tmp/ios_checks_list.json $count"
          if [ "$count" -eq 0 ]; then
            echo "No ios-checksum-* artifacts found"
            exit 0
          fi

          for i in $(seq 0 $((count-1))); do
            url=$(jq -r ".[$i].url" /tmp/ios_checks_list.json)
            name=$(jq -r ".[$i].name" /tmp/ios_checks_list.json)
            echo "Downloading artifact $name"
            curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" -o /tmp/artifact.zip "$url"
            unzip -o /tmp/artifact.zip -d ios-checksums >/dev/null
            rm -f /tmp/artifact.zip
          done

      - name: Merge ios checksums
        run: |
          python3 - <<'PY'
          import json,glob,sys
          out={}
          for fn in glob.glob('ios-checksums/*.json'):
              try:
                  with open(fn,'r') as f:
                      out.update(json.load(f))
              except Exception as e:
                  print("warning reading", fn, e, file=sys.stderr)
          with open('combined_ios_checksums.json','w') as f:
              json.dump(out,f)
          print('Wrote combined_ios_checksums.json with keys:', list(out.keys()))
          PY

      - name: Download routing checksum artifact
        uses: actions/download-artifact@v4
        with:
          name: routing-checksum
          path: routing-checksum
        continue-on-error: true

      - name: Checkout mobile-sdk-ios-swift
        uses: actions/checkout@v7
        with:
          repository: massif-maps/MassifMaps-ios-swift
          token: '${{ secrets.AAR_SWIFT_TOKEN }}'
          path: mobile-sdk-ios-swift

      - name: Generate Package.swift using precomputed checksums and publish/tag
        run: |
          # Profiles the iOS matrix actually builds. 'full+gdal' is excluded there (see the matrix),
          # so including it here would send the generator looking for an iOS zip that was never
          # uploaded and it would abort on the missing checksum.
          PROFILES_CSV=$(echo '${{ needs.prepare.outputs.profiles }}' | python3 -c 'import json,sys; print(",".join(p for p in json.load(sys.stdin) if p != "full+gdal"))')
          # Extract routing checksum if available
          ROUTING_CHECKSUM=""
          if [ -f routing-checksum/routing-checksum.json ]; then
            ROUTING_CHECKSUM=$(python3 -c 'import json; d=json.load(open("routing-checksum/routing-checksum.json")); print(d.get("routing",""))')
          fi
          ROUTING_ARGS=""
          if [ -n "$ROUTING_CHECKSUM" ]; then
            ROUTING_ARGS="--routing-checksum $ROUTING_CHECKSUM"
          fi
          python ./scripts/generate-swiftpackage.py --version ${{ github.event.inputs.version }} --profiles "$PROFILES_CSV" --checksums-file ./combined_ios_checksums.json $ROUTING_ARGS
          cd mobile-sdk-ios-swift
          # pass checksums file path relative to repo path
          mv -f ../dist/ios_metal/Package.swift ./
          git add Package.swift
          git commit -m "Automated update Package.swift from workflow for new release" || true
          git push origin main
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

  update-release:
    runs-on: ubuntu-latest
    needs: [create-release, build, build-routing, create-jitpack-swiftpackage-release]
    if: github.event.inputs.publish == 'true'
    permissions:
      contents: write # release changes require contents write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oleksiyrudenko/gha-git-credentials@v2.1.1
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          global: true
          actor: farfromrefug
          name: Martin Guillon
          email: dev@akylas.fr

      - name: Generate CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          useGitmojis: false
          excludeTypes: build,docs,other,style,chore,perf,doc
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.create-release.outputs.VERSION_TAG }}

      - name: Commit CHANGELOG.md
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          branch: master
          commit_message: 'docs: update CHANGELOG.md for v${{ github.event.inputs.version }} [skip ci]'
          file_pattern: CHANGELOG.md

      - name: Build release body
        env:
          VERSION: ${{ github.event.inputs.version }}
          CHANGELOG: ${{ steps.changelog.outputs.changes }}
        run: |
          cat > release_body.md <<EOF
          ${CHANGELOG}

          ---

          ## Installation

          ### Android

          \`\`\`groovy
          repositories {
              mavenCentral()
              maven { url 'https://jitpack.io' }
          }
          dependencies {
              implementation 'com.github.massif-maps:MassifMaps-android-aar:v${VERSION}'
          }
          \`\`\`

          Add the INTERNET permission to \`AndroidManifest.xml\`:

          \`\`\`xml
          <uses-permission android:name="android.permission.INTERNET"/>
          \`\`\`

          ### iOS

          Use Swift Package Manager:

          1. In Xcode: **File → Add Packages…**
          2. Paste the package URL: \`https://github.com/massif-maps/MassifMaps-ios-swift\`
          3. Select version \`v${VERSION}\` and add it to your target.

          Or download the prebuilt framework attached to this release.
          EOF

      - name: Update release with body and publish
        uses: irongut/EditRelease@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          id: ${{ needs.create-release.outputs.RELEASE_UPLOAD_ID }}
          files: release_body.md
          replacebody: true
          prerelease: false
          draft: false

  cleanup-release:
    name: Delete draft release on failed/cancelled runs
    runs-on: ubuntu-latest
    needs: [create-release, build, build-routing, create-jitpack-swiftpackage-release, update-release]
    # run only when the overall workflow failed or was cancelled
    if: ${{ failure() || cancelled() }}
    permissions:
      contents: write
    steps:
      - name: Rollback draft release
        uses: author/action-rollback@5e7dd5c4692af3cb62ee64875e62579b2fd857c0
        with:
          release_id: ${{ needs.create-release.outputs.RELEASE_UPLOAD_ID }}
          tag: v${{ github.event.inputs.version }}
          #  If the release does not exist but the tag does, setting this to true will remove the tag.
          delete_orphan_tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
