name: Style tools CLI

# Builds massif-style to WebAssembly and packs @massif-maps/style-tools. build.yml calls it and
# publishes the tarball on the SDK version. docs/contributing/style-tools.md: why TypeScript + wasm.
# A push to master publishes a dev build too (publish-dev), so a style using a compiler change
# need not wait for the next SDK release.

on:
  pull_request:
    paths:
      - 'tools/style-cli/**'
      - 'scripts/gen-cartocss-properties.py'
      - 'libs-massif/**'
      - '.github/workflows/release-style-tools.yml'
  push:
    branches: [master]
    paths:
      - 'tools/style-cli/**'
      - 'scripts/gen-cartocss-properties.py'
      - 'libs-massif/**'
      - '.github/workflows/release-style-tools.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'version number (no leading v)'
        required: true
        type: string

env:
  PACKAGE_DIR: tools/style-cli

jobs:
  build-wasm:
    name: Build massif-style.wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      # The SAME Boost the SDK builds against (BUILDING.md, build.yml). It has to be: the wasm
      # compiles the style compiler, and boost.spirit.karma resolves an ambiguous grammar
      # differently between versions and between compilers - a generator that wrote a nested `or`
      # without parentheses under emcc, and with them under clang, silently corrupted every
      # converted style's filters while every native check passed.
      - name: Prepare Boost
        uses: ./.github/actions/prepare-boost

      - name: Build wasm
        working-directory: libs-massif/cartocss/util
        run: |
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=MinSizeRel
          emmake make -C build-wasm -j"$(nproc)" massif-style
          ls -la build-wasm/massif-style.*

      - name: Report size
        run: |
          cd libs-massif/cartocss/util/build-wasm
          echo "### wasm artifact" >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; ls -lh massif-style.wasm massif-style.mjs; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: massif-style-wasm
          path: |
            libs-massif/cartocss/util/build-wasm/massif-style.wasm
            libs-massif/cartocss/util/build-wasm/massif-style.mjs
          if-no-files-found: error

  package:
    name: Build and test the npm package
    needs: [build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # mapbox2css translates onto this list; publishing it stale would silently drop properties
      # the decoder has since gained.
      - name: Check the CartoCSS property allowlist is current
        run: python3 scripts/gen-cartocss-properties.py --check

      - uses: actions/download-artifact@v4
        with:
          name: massif-style-wasm
          path: ${{ env.PACKAGE_DIR }}/wasm

      - name: Build and test
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          npm ci
          npm run build
          npm test

      # Runs the packaged CLI end to end through the wasm. A module that loads but cannot reach the
      # filesystem (a NODERAWFS regression) fails here rather than on a user's machine, and
      # --validate compiles mapbox2css's own output with the real CartoCSS compiler.
      - name: Smoke test the wasm subcommand
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          node dist/cli.js css2xml \
            ../../libs-massif/cartocss/util/fixtures/roundtrip/project.json \
            /tmp/roundtrip.xml
          test -s /tmp/roundtrip.xml
          node dist/cli.js mapbox2css test/fixtures/style.json /tmp/mapbox2css --validate

      # The patch after npm's `latest`, as a prerelease: above every release so far, below the next one
      - name: Dev version
        id: dev
        if: ${{ !inputs.version && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          latest=$(npm view @massif-maps/style-tools version)
          IFS=. read -r major minor patch <<< "$latest"
          echo "version=$major.$minor.$((patch + 1))-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set version and pack
        run: python3 scripts/npm-packages.py pack "${{ inputs.version || steps.dev.outputs.version || '0.0.0-devel' }}" --only style-tools

      - uses: actions/upload-artifact@v4
        with:
          name: style-tools-tarball
          path: dist/npm/*.tgz
          if-no-files-found: error

  publish-dev:
    name: Publish the dev build
    # not under build.yml: a call carries its version and its caller's workflow_dispatch event
    needs: [package]
    if: ${{ !inputs.version && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: style-tools-tarball
          path: dist/npm
      # Trusted publishing: npmjs.com lists this workflow as well as build.yml for the package.
      # `dev`, never `latest` or `next`: an app opts in with `@massif-maps/style-tools@dev`.
      - name: Publish to npm
        run: |
          npm install -g npm@^11.5.1
          python3 scripts/npm-packages.py publish --tag dev
