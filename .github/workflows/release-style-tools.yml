name: Style tools CLI

# Builds massif-style to WebAssembly and packs @massif-maps/style-tools. release.yml calls it with
# the version it computed and, with `publish`, releases it: npm, and a style-tools-vX.Y.Z GitHub
# release carrying the wasm. Run by hand it publishes a dev build (publish-dev), so a style using
# a compiler change need not wait for a release. docs/contributing/style-tools.md: why TypeScript + wasm.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'version number (no leading v)'
        required: true
        type: string
      publish:
        description: 'Publish to npm and create the GitHub release?'
        default: false
        type: boolean
      prerelease:
        description: 'Pre-release: npm dist-tag next, GitHub prerelease'
        default: false
        type: boolean
      wasm_ready:
        description: 'The wasm is already built in this run (release.yml builds it once for both)'
        default: false
        type: boolean

env:
  PACKAGE_DIR: tools/style-cli

jobs:
  wasm:
    if: ${{ !inputs.wasm_ready }}
    uses: ./.github/workflows/build-wasm.yml

  package:
    name: Build and test the npm package
    needs: [wasm]
    if: ${{ !cancelled() && needs.wasm.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # mapbox2css translates onto this list; publishing it stale would silently drop properties
      # the decoder has since gained.
      - name: Check the CartoCSS property allowlist is current
        run: python3 scripts/gen-cartocss-properties.py --check

      - uses: actions/download-artifact@v4
        with:
          name: massif-style-wasm
          path: ${{ env.PACKAGE_DIR }}/wasm

      - name: Build and test
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          npm ci
          npm run build
          npm test

      # Runs the packaged CLI end to end through the wasm. A module that loads but cannot reach the
      # filesystem (a NODERAWFS regression) fails here rather than on a user's machine, and
      # --validate compiles mapbox2css's own output with the real CartoCSS compiler.
      - name: Smoke test the wasm subcommand
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          node dist/cli.js css2xml \
            ../../libs-massif/cartocss/util/fixtures/roundtrip/project.json \
            /tmp/roundtrip.xml
          test -s /tmp/roundtrip.xml
          node dist/cli.js css2xml \
            ../../libs-massif/cartocss/util/fixtures/undefined-variable/project.json \
            /tmp/undefined-variable.xml
          test -s /tmp/undefined-variable.xml
          node dist/cli.js mapbox2css test/fixtures/style.json /tmp/mapbox2css --validate

      # The patch after npm's `latest`, as a prerelease: above every release so far, below the next one
      - name: Dev version
        id: dev
        if: ${{ !inputs.version && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          latest=$(npm view @massif-maps/style-tools version)
          IFS=. read -r major minor patch <<< "$latest"
          echo "version=$major.$minor.$((patch + 1))-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set version and pack
        run: python3 scripts/npm-packages.py pack --tools-version "${{ inputs.version || steps.dev.outputs.version || '0.0.0-devel' }}" --only style-tools

      - uses: actions/upload-artifact@v4
        with:
          name: style-tools-tarball
          path: dist/npm/*.tgz
          if-no-files-found: error

  publish-dev:
    name: Publish the dev build
    # not under release.yml: a call carries its version and its caller's workflow_dispatch event
    needs: [package]
    if: ${{ !cancelled() && needs.package.result == 'success' && !inputs.version && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: style-tools-tarball
          path: dist/npm
      # Trusted publishing: npmjs.com lists this workflow as well as release.yml for the package.
      # `dev`, never `latest` or `next`: an app opts in with `@massif-maps/style-tools@dev`.
      - name: Publish to npm
        run: |
          npm install -g npm@^11.5.1
          python3 scripts/npm-packages.py publish --tag dev

  release:
    name: Release
    needs: [package]
    if: ${{ !cancelled() && needs.package.result == 'success' && inputs.version && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: style-tools-tarball
          path: dist/npm
      - uses: actions/download-artifact@v4
        with:
          name: massif-style-wasm
          path: dist/wasm

      - name: Release notes
        run: |
          previous=$(python3 scripts/release-tags.py "style-tools-v$VERSION")
          {
            echo "Massif style tools $VERSION. npm: \`@massif-maps/style-tools@$VERSION\`. The compiler as WebAssembly is attached."
            echo
            python3 scripts/release-notes.py --product tools "${previous#previous=}" HEAD
          } > notes.md

      # Trusted publishing (OIDC, no token): npmjs.com lists release.yml, the workflow that dispatched this run.
      - name: Publish to npm
        run: |
          npm install -g npm@^11.5.1
          python3 scripts/npm-packages.py publish --tag ${{ inputs.prerelease && 'next' || 'latest' }}

      - name: GitHub release
        run: |
          gh release create "style-tools-v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Massif style tools $VERSION" --notes-file notes.md \
            ${{ inputs.prerelease && '--prerelease' || '' }} dist/wasm/*
