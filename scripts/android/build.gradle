buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        // classpath 'io.github.gradle-nexus:publish-plugin:1.1.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    buildDir = '../../build/android-aar'
}

// apply plugin: 'signing'
// apply plugin: 'maven-publish'
apply plugin: 'com.android.library'
// apply plugin: 'io.github.gradle-nexus.publish-plugin'

// apply from: "publish.gradle"

android {
    namespace "com.massifmaps"
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
      sourceCompatibility JavaVersion.VERSION_17
      targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['../../generated/android-java/proxies', '../../android/java']
            jniLibs.srcDir '../../dist/android/'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        doNotStrip "*/*/libmassif.so"
    }
    lintOptions {
      checkReleaseBuilds false
      // Or, if you prefer, you can continue to check for errors in release builds,
      // but continue the build even when errors are found:
      abortOnError false
    }
}

dependencies {
    // @IntDef on the generated constant namespaces (PanningMode, LineJoinType, ...).
    api 'androidx.annotation:annotation:1.9.1'
}

task javadoc(type: Javadoc) {
    source = android.sourceSets.main.java.srcDirs
    classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
    destinationDir = file("../../dist/android/javadoc")
    title = "Massif Maps"
    options.setMemberLevel(JavadocMemberLevel.PUBLIC)
    failOnError false
}

task sourcesJar(type: Jar) {
    from android.sourceSets.main.java.source
    archiveClassifier = "sources"
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    from tasks.javadoc.destinationDir
    archiveClassifier = "javadoc"
}

artifacts {
    archives sourcesJar, javadocJar
}

group = 'com.massifmaps'
version = System.getProperty('build-version')

