plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.massifmaps.releasecheck'
    compileSdk 35
    defaultConfig {
        applicationId 'com.massifmaps.releasecheck'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def aar = 'com.github.massif-maps:MassifMaps-android-aar'
    if (project.hasProperty('massifAarDir')) {
        // Local AARs instead of JitPack: a map AAR and the routing AAR, from dist/ or a release.
        implementation fileTree(dir: project.massifAarDir, include: ['*.aar'])
    } else {
        implementation massifVariant == 'full' ? "$aar:$massifVersion" : "$aar:$massifVersion:$massifVariant@aar"
        implementation "$aar:$massifVersion:routing@aar"
    }
}
