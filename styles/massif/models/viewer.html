<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Massif models</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfdbe6; font: 13px system-ui, sans-serif; }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  #ui { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.88); padding: 8px 10px; border-radius: 6px; line-height: 1.8; }
  #ui label { display: block; }
  #stats { position: absolute; bottom: 10px; left: 10px; color: #234; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <b>Scene</b>
  <label><input type="radio" name="scene" value="street" checked> street</label>
  <label><input type="radio" name="scene" value="models"> one of each</label>
  <label><input type="radio" name="scene" value="park"> park</label>
  <label><input type="radio" name="scene" value="wind"> wind farm</label>
  <b>Style</b>
  <label><input type="checkbox" id="variety" checked> variety (random(): model, scale, yaw, tint)</label>
  <label><input type="checkbox" id="spin" checked> spin rotors</label>
  <label>sun azimuth <input type="range" id="sun" min="0" max="360" value="210"></label>
</div>
<div id="stats"></div>
<script>
// $MODELS$ is replaced by gen_models.py --viewer with { name: base64 glb }
const MODELS = $MODELS$;

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: true });

function parseGLB(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const dv = new DataView(bytes.buffer);
  const jsonLen = dv.getUint32(12, true);
  const json = JSON.parse(new TextDecoder().decode(bytes.subarray(20, 20 + jsonLen)));
  const binStart = 20 + jsonLen + 8;
  const read = (i) => {
    const acc = json.accessors[i], view = json.bufferViews[acc.bufferView];
    const n = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4 }[acc.type] * acc.count;
    const off = binStart + (view.byteOffset || 0) + (acc.byteOffset || 0);
    const T = { 5126: Float32Array, 5121: Uint8Array, 5123: Uint16Array, 5125: Uint32Array }[acc.componentType];
    return new T(bytes.buffer.slice(off, off + n * T.BYTES_PER_ELEMENT));
  };
  const prim = json.meshes[0].primitives[0];
  const pos = read(prim.attributes.POSITION), col = read(prim.attributes.COLOR_0), idx = read(prim.indices);
  const nrm = prim.attributes.NORMAL !== undefined ? read(prim.attributes.NORMAL) : null;
  // the file's normals when it has them, else flat shading, as the SDK loader does
  const P = new Float32Array(idx.length * 3), N = new Float32Array(idx.length * 3), C = new Float32Array(idx.length * 3);
  const toDisplay = (c) => c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
  let maxY = 0;
  for (let t = 0; t < idx.length; t += 3) {
    const v = [0, 1, 2].map(k => idx[t + k]);
    const p = v.map(i => [pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]]);
    const e1 = p[1].map((x, k) => x - p[0][k]), e2 = p[2].map((x, k) => x - p[0][k]);
    let n = [e1[1] * e2[2] - e1[2] * e2[1], e1[2] * e2[0] - e1[0] * e2[2], e1[0] * e2[1] - e1[1] * e2[0]];
    const l = Math.hypot(...n) || 1; n = n.map(x => x / l);
    for (let k = 0; k < 3; k++) {
      P.set(p[k], (t + k) * 3); N.set(nrm ? [nrm[v[k] * 3], nrm[v[k] * 3 + 1], nrm[v[k] * 3 + 2]] : n, (t + k) * 3);
      C.set([0, 1, 2].map(c => toDisplay(col[v[k] * 4 + c] / 255)), (t + k) * 3);
      maxY = Math.max(maxY, p[k][1]);
    }
  }
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  [[P, 0], [N, 1], [C, 2]].forEach(([data, loc]) => {
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
  });
  const inst = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, inst);
  // per instance: x, y, z, yaw | scale, spin phase, tint mix, hue
  [3, 4].forEach((loc, i) => { gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, 32, i * 16); gl.vertexAttribDivisor(loc, 1); });
  gl.bindVertexArray(null);
  return { vao, inst, count: idx.length, tris: idx.length / 3, height: maxY };
}

const VS = `#version 300 es
layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNormal; layout(location=2) in vec3 aColor;
layout(location=3) in vec4 aInst; layout(location=4) in vec4 aInst2;
uniform mat4 uViewProj; uniform float uTime; uniform float uSpin; uniform vec3 uOffset;
out vec3 vNormal; out vec3 vColor; out vec3 vWorld;
mat3 rotY(float a) { float c = cos(a), s = sin(a); return mat3(c, 0, -s, 0, 1, 0, s, 0, c); }
mat3 rotZ(float a) { float c = cos(a), s = sin(a); return mat3(c, s, 0, -s, c, 0, 0, 0, 1); }
vec3 hsl(float h, float s, float l) {
  vec3 rgb = clamp(abs(mod(h * 6.0 + vec3(0, 4, 2), 6.0) - 3.0) - 1.0, 0.0, 1.0);
  return l + s * (rgb - 0.5) * (1.0 - abs(2.0 * l - 1.0));
}
void main() {
  // the rotor spins about its own axis (glTF -z) before the instance turns it
  mat3 spin = rotZ(uSpin > 0.0 ? uSpin * uTime + aInst2.y : 0.0);
  mat3 m = rotY(aInst.w) * aInst2.x;
  vec3 p = m * (spin * aPos) + uOffset * aInst2.x + aInst.xyz;
  vNormal = rotY(aInst.w) * (spin * aNormal);
  vColor = mix(aColor, aColor * hsl(aInst2.w, 0.6, 0.8) * 1.25, aInst2.z);
  vWorld = p;
  gl_Position = uViewProj * vec4(p, 1.0);
}`;
const FS = `#version 300 es
precision highp float;
in vec3 vNormal; in vec3 vColor; in vec3 vWorld; uniform vec3 uSun; uniform vec3 uEye; out vec4 o;
void main() {
  vec3 n = normalize(vNormal);
  if (!gl_FrontFacing) n = -n;
  float ndl = max(dot(n, uSun), 0.0);
  vec3 c = vColor * (0.5 + 0.08 * n.y + 0.65 * ndl);
  float fog = clamp((length(vWorld - uEye) - 250.0) / 1400.0, 0.0, 0.7);
  o = vec4(mix(c, vec3(0.81, 0.86, 0.90), fog), 1.0);
}`;
const GROUND_VS = `#version 300 es
layout(location=0) in vec3 aPos; uniform mat4 uViewProj; out vec3 vWorld;
void main() { vWorld = aPos; gl_Position = uViewProj * vec4(aPos, 1.0); }`;
const GROUND_FS = `#version 300 es
precision highp float; in vec3 vWorld; uniform vec3 uEye; uniform vec4 uBlobs[64]; uniform int uBlobCount; out vec4 o;
void main() {
  vec3 grass = vec3(0.56, 0.66, 0.42), road = vec3(0.55, 0.55, 0.56), walk = vec3(0.74, 0.73, 0.70);
  float x = abs(vWorld.x);
  vec3 c = uBlobCount > 0 ? (x < 7.0 ? road : x < 12.0 ? walk : grass) : grass;
  float ao = 1.0;
  for (int i = 0; i < 64; i++) { if (i >= uBlobCount) break;
    float d = length(vWorld.xz - uBlobs[i].xy) / uBlobs[i].z; ao *= 1.0 - 0.35 * (1.0 - smoothstep(0.2, 1.0, d)); }
  c *= ao;
  float fog = clamp((length(vWorld - uEye) - 250.0) / 1400.0, 0.0, 0.7);
  o = vec4(mix(c, vec3(0.81, 0.86, 0.90), fog), 1.0);
}`;
function program(vs, fs) {
  const p = gl.createProgram();
  [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([t, s]) => {
    const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(sh);
    gl.attachShader(p, sh);
  });
  gl.linkProgram(p);
  return p;
}
const prog = program(VS, FS), groundProg = program(GROUND_VS, GROUND_FS);
const models = Object.fromEntries(Object.entries(MODELS).map(([k, v]) => [k, parseGLB(v)]));
const TREES = Object.keys(models).filter(k => k.startsWith('tree-'));

const groundVao = gl.createVertexArray();
gl.bindVertexArray(groundVao);
const gb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, gb);
const G = 3000;
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-G, 0, -G, G, 0, -G, G, 0, G, -G, 0, -G, G, 0, G, -G, 0, G]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

// mulberry32 seeded by the instance, like the style's random(min, max)
function random(seed) { let t = (seed + 0x6D2B79F5) | 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function rnd(seed, salt, a, b) { return a + (b - a) * random(seed * 7919 + salt); }

let scene = 'street', variety = true, spinOn = true;
let groups = {}, blobs = [], camTarget = [0, 6, 0], camDist = 70, yaw = 0.7, pitch = 0.32;

function build() {
  groups = {}; blobs = [];
  const add = (name, x, z, seed, opts = {}) => {
    const vary = variety && !opts.fixed;
    const model = vary && opts.tree ? TREES[Math.floor(rnd(seed, 1, 0, TREES.length))] : name;
    const scale = vary ? rnd(seed, 2, 0.85, 1.15) : 1;
    const yawA = opts.yaw !== undefined ? opts.yaw : (vary ? rnd(seed, 3, 0, Math.PI * 2) : 0);
    const mix = vary && opts.tree ? 0.21 : 0;
    (groups[model] = groups[model] || []).push(x, 0, z, yawA, scale, rnd(seed, 4, 0, 6.28), mix, rnd(seed, 5, 50, 200) / 360);
    if (opts.tree) blobs.push([x, z, 4.5 * scale]);
  };
  if (scene === 'street') {
    for (let i = 0; i < 14; i++) for (const side of [-1, 1]) {
      const seed = i * 2 + (side > 0 ? 1 : 0) + 17;
      add(TREES[i % TREES.length], side * 9.5, -130 + i * 20, seed, { tree: true });
    }
    camTarget = [0, 7, 0]; camDist = 80;
  } else if (scene === 'models') {
    TREES.forEach((t, i) => add(t, -16 + i * 16, 0, i, { tree: true, fixed: true }));
    camTarget = [0, 6, 0]; camDist = 45;
  } else if (scene === 'park') {
    for (let i = 0; i < 60; i++) {
      const a = rnd(i, 8, 0, Math.PI * 2), r = Math.sqrt(rnd(i, 9, 0, 1)) * 70;
      add(TREES[i % TREES.length], Math.cos(a) * r, Math.sin(a) * r, i + 100, { tree: true });
    }
    camTarget = [0, 5, 0]; camDist = 160;
  } else {
    for (let i = 0; i < 6; i++) {
      const x = (i % 3) * 320 - 320, z = Math.floor(i / 3) * 380 - 190;
      const seed = i + 300;
      add('wind-turbine-tower', x, z, seed, { yaw: 0.4, fixed: true });
      add('wind-turbine-rotor', x, z, seed, { yaw: 0.4, fixed: true });
    }
    camTarget = [0, 60, 0]; camDist = 900;
  }
  for (const [name, data] of Object.entries(groups)) {
    gl.bindBuffer(gl.ARRAY_BUFFER, models[name].inst);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.DYNAMIC_DRAW);
  }
  const tris = Object.entries(groups).reduce((s, [n, d]) => s + models[n].tris * d.length / 8, 0);
  const sizes = Object.entries(MODELS).map(([k, v]) => `${k} ${models[k].tris} tris ${Math.round(v.length * 0.75 / 1024)} KB`).join(' · ');
  document.getElementById('stats').textContent = `${Object.values(groups).reduce((s, d) => s + d.length / 8, 0)} instances, ${tris} triangles — ${sizes}`;
}

function mat4mul(a, b) { const o = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; }
function perspective(fovy, aspect, near, far) { const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far); return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]); }
function lookAt(e, t) {
  const sub = (a, b) => a.map((x, i) => x - b[i]), norm = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const z = norm(sub(e, t)), x = norm(cross([0, 1, 0], z)), y = cross(z, x), dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  return new Float32Array([x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1]);
}

function frame(ms) {
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== canvas.clientWidth * dpr) { canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr; }
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.81, 0.86, 0.90, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  const eye = [camTarget[0] + camDist * Math.cos(pitch) * Math.sin(yaw), camTarget[1] + camDist * Math.sin(pitch), camTarget[2] + camDist * Math.cos(pitch) * Math.cos(yaw)];
  const vp = mat4mul(perspective(0.8, canvas.width / canvas.height, 0.5, 6000), lookAt(eye, camTarget));
  const sa = document.getElementById('sun').value * Math.PI / 180, sun = [Math.sin(sa) * 0.6, 0.65, Math.cos(sa) * 0.6];

  gl.useProgram(groundProg);
  gl.uniformMatrix4fv(gl.getUniformLocation(groundProg, 'uViewProj'), false, vp);
  gl.uniform3fv(gl.getUniformLocation(groundProg, 'uEye'), eye);
  const flat = new Float32Array(64 * 4); blobs.slice(0, 64).forEach((b, i) => flat.set([b[0], b[1], b[2], 0], i * 4));
  gl.uniform4fv(gl.getUniformLocation(groundProg, 'uBlobs'), flat);
  gl.uniform1i(gl.getUniformLocation(groundProg, 'uBlobCount'), scene === 'street' ? Math.min(64, blobs.length) : 0);
  gl.bindVertexArray(groundVao); gl.drawArrays(gl.TRIANGLES, 0, 6);

  gl.useProgram(prog);
  gl.uniformMatrix4fv(gl.getUniformLocation(prog, 'uViewProj'), false, vp);
  gl.uniform3fv(gl.getUniformLocation(prog, 'uSun'), sun);
  gl.uniform3fv(gl.getUniformLocation(prog, 'uEye'), eye);
  gl.uniform1f(gl.getUniformLocation(prog, 'uTime'), ms / 1000);
  for (const [name, data] of Object.entries(groups)) {
    const rotor = name === 'wind-turbine-rotor';
    gl.uniform1f(gl.getUniformLocation(prog, 'uSpin'), rotor && spinOn ? 1.6 : 0);
    gl.uniform3fv(gl.getUniformLocation(prog, 'uOffset'), rotor ? [0, 81.4, 0] : [0, 0, 0]);
    gl.bindVertexArray(models[name].vao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, models[name].count, data.length / 8);
  }
  requestAnimationFrame(frame);
}

let drag = null;
canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.005; pitch = Math.min(1.5, Math.max(0.02, pitch + (e.clientY - drag[1]) * 0.005)); drag = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', () => drag = null);
canvas.addEventListener('wheel', e => { camDist = Math.min(3000, Math.max(8, camDist * Math.exp(e.deltaY * 0.001))); e.preventDefault(); }, { passive: false });
document.querySelectorAll('input[name=scene]').forEach(r => r.addEventListener('change', () => { scene = r.value; build(); }));
document.getElementById('variety').addEventListener('change', e => { variety = e.target.checked; build(); });
document.getElementById('spin').addEventListener('change', e => { spinOn = e.target.checked; });
build();
requestAnimationFrame(frame);
</script>
</body>
</html>
