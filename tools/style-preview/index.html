<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Massif style preview</title>
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 10px; background: #1c1f24; color: #ddd; }
  #bar input[type=text] { flex: 1; min-width: 200px; padding: 4px 6px; border: 1px solid #444; border-radius: 3px;
                          background: #12151a; color: #ddd; font: inherit; }
  #bar button, #bar select { padding: 4px 8px; border: 1px solid #444; border-radius: 3px;
                             background: #2a2f38; color: #ddd; font: inherit; cursor: pointer; }
  #maps { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; gap: 1px;
          background: #1c1f24; }
  #maps.rows { grid-template-rows: 1fr 1fr; }
  .pane { position: relative; min-width: 0; min-height: 0; background: #f7f5f0; }
  .pane.hidden { display: none; }
  .pane .map { position: absolute; inset: 0; }
  .pane iframe.map { width: 100%; height: 100%; border: 0; }
  .tag { position: absolute; z-index: 2; top: 8px; left: 8px; padding: 2px 8px; border-radius: 3px;
         background: rgba(28,31,36,.85); color: #eee; font-weight: 600; pointer-events: none; }
  .readout { position: absolute; z-index: 2; bottom: 6px; left: 6px; padding: 2px 6px; border-radius: 3px;
             background: rgba(28,31,36,.8); color: #d7dde6; pointer-events: none;
             font: 11px/1.5 ui-monospace, Menlo, monospace; white-space: pre; }
  .err { position: absolute; z-index: 3; bottom: 8px; left: 8px; right: 8px; max-height: 40%; overflow: auto;
         padding: 6px 8px; border-radius: 3px; background: rgba(120,20,20,.9); color: #fff;
         white-space: pre-wrap; display: none; }
  #gaps { display: none; max-height: 38%; overflow: auto; padding: 8px 12px; background: #14171c; color: #cfd4dc;
          border-top: 1px solid #2a2f38; }
  #gaps h3 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #8fa0b6; }
  #gaps code { color: #ffd580; }
  #gaps .miss { color: #ff9b9b; }
  #gaps ul { margin: 0; padding-left: 18px; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <label>style</label>
    <input id="style-url" type="text" value="https://tiles.openfreemap.org/styles/liberty">
    <button id="reload">reload</button>
    <select id="variant" title="a Massif variant: the page reloads on it, camera kept" style="display:none">
      <option>streets</option><option>outdoor</option><option>topo</option><option>hybrid</option>
      <option>eink</option><option value="custom">custom (example project)</option><option value="osm">osm (example project)</option>
    </select>
    <label><input id="sync" type="checkbox" checked> sync</label>
    <label title="building shadows in the massif row; they cost the page most of its frame rate"><input id="shadows" type="checkbox"> shadows</label>
    <label title="3D terrain in every pane: Mapterhorn under MapLibre and the SDK, Mapbox's own DEM under the reference"><input id="terrain" type="checkbox" autocomplete="off"> terrain</label>
    <label title="a POI inside a 3D building drawn on its roof (the style's poi_on_roof); SDK panes only, MapLibre has no such property"><input id="poiroof" type="checkbox" autocomplete="off"> POIs on roofs</label>
    <select id="local-set"></select>
    <button id="fit">fit local</button>
    <button id="gaps-toggle">gaps</button>
    <button id="massif-toggle">massif row</button>
    <label title="the SDK panes' day-cycle light; the Standard reference takes the matching preset">hour
      <input id="hour" type="range" min="0" max="24" step="0.25" value="12"></label><span id="hour-v">12:00</span>
    <select id="ref" title="reference style drawn in place of the local pane">
      <option value="">no reference</option>
      <option>mapbox-standard</option><option>mapbox-standard-satellite</option>
      <option>maptiler-streets-v4</option><option>maptiler-outdoor-v4</option>
      <option>maptiler-topo-v4</option><option>maptiler-hybrid-v4</option>
      <option>maptiler-openstreetmap</option>
    </select>
  </div>
  <div id="maps">
    <div class="pane"><div class="tag" id="tag-l">maplibre — openfreemap</div>
      <div class="map" id="map-l"></div><div class="readout" id="ro-l"></div>
      <div class="err" id="err-l"></div></div>
    <div class="pane"><div class="tag" id="tag-r">maplibre — local</div>
      <div class="map" id="map-r"></div><div class="readout" id="ro-r"></div>
      <div class="err" id="err-r"></div></div>
    <div class="pane hidden" id="pane-ref"><div class="tag" id="tag-ref"></div>
      <iframe class="map" id="ref-frame"></iframe></div>
    <div class="pane hidden" id="pane-ml"><div class="tag" id="tag-ml">massif — openfreemap</div>
      <iframe class="map" id="massif-l"></iframe><div class="err" id="err-ml"></div></div>
    <div class="pane hidden" id="pane-mr"><div class="tag">massif — local</div>
      <iframe class="map" id="massif-r"></iframe><div class="err" id="err-mr"></div></div>
  </div>
  <div id="gaps"></div>
</div>
<script>
const ORIGIN = location.origin;
// Grenoble, and ?lon=/?lat=/?zoom=/?tilt=/?rot= to open somewhere else. tilt is maplibre's PITCH,
// 0 = straight down, which is what the readouts print for both rows.
const ASKED = new URLSearchParams(location.search);
const num = (name, fallback) => (ASKED.has(name) ? Number(ASKED.get(name)) : fallback);
const START = {
  center: [num('lon', 5.7245), num('lat', 45.1885)],
  zoom: num('zoom', 13),
  pitch: num('tilt', 0),
  bearing: num('rot', 0),
};

const $ = (id) => document.getElementById(id);
let localName = null, localTileJSON = null, remoteTileJSON = null, styleJSON = null, tilesets = {};

/** every vector source in the style points at one tileset; swap them all to `url`. */
function retarget(style, url) {
  const out = JSON.parse(JSON.stringify(style));
  for (const src of Object.values(out.sources || {})) {
    if (src.type !== 'vector') continue;
    delete src.tiles;
    src.url = url;
  }
  return out;
}

/** field names a style layer reads, from both legacy filters and expressions. */
function fieldsOf(node, out) {
  if (Array.isArray(node)) {
    const op = node[0];
    if (typeof op === 'string' && typeof node[1] === 'string') {
      if (op === 'get' || op === 'has' || op === '!has') out.add(node[1]);
      else if (['==', '!=', '>', '<', '>=', '<=', 'in', '!in'].includes(op) &&
               node[1] !== '$type' && node[1] !== '$id') out.add(node[1]);
    }
    node.forEach((c) => fieldsOf(c, out));
  } else if (node && typeof node === 'object') {
    for (const [k, v] of Object.entries(node)) {
      if (k === 'property' && typeof v === 'string') out.add(v);
      fieldsOf(v, out);
    }
  }
  return out;
}

function styleDemand(style) {
  const demand = new Map();
  for (const l of style.layers || []) {
    if (!l['source-layer']) continue;
    if (!demand.has(l['source-layer'])) demand.set(l['source-layer'], new Set());
    const into = demand.get(l['source-layer']);
    fieldsOf(l.filter, into); fieldsOf(l.layout, into); fieldsOf(l.paint, into);
  }
  return demand;
}

function schemaOf(tilejson) {
  const out = new Map();
  for (const l of (tilejson && tilejson.vector_layers) || []) {
    out.set(l.id, new Set(Object.keys(l.fields || {})));
  }
  return out;
}

/** a localized name is dropped when it equals the default, so `name` standing alone satisfies it. */
function has(schema, layer, field) {
  const fields = schema.get(layer);
  if (!fields) return false;
  if (fields.has(field)) return true;
  return /^name[:_]/.test(field) && (fields.has('name') || fields.has('name_int'));
}

function renderGaps() {
  const el = $('gaps');
  if (!styleJSON || !localTileJSON || !remoteTileJSON) { el.innerHTML = 'load a style first'; return; }
  const demand = styleDemand(styleJSON);
  const local = schemaOf(localTileJSON), remote = schemaOf(remoteTileJSON);
  const html = [];

  const missLayers = [], missFields = [];
  for (const [layer, fields] of demand) {
    if (!local.has(layer)) { missLayers.push(layer); continue; }
    const gone = [...fields].filter((f) => !has(local, layer, f));
    if (gone.length) missFields.push([layer, gone]);
  }
  html.push('<h3>the style reads this and the local tileset does not carry it</h3>');
  html.push(missLayers.length
    ? '<ul>' + missLayers.map((l) => `<li class="miss">layer <code>${l}</code></li>`).join('') + '</ul>'
    : '<div>every source-layer the style reads is present</div>');
  html.push(missFields.length
    ? '<ul>' + missFields.map(([l, f]) =>
        `<li><code>${l}</code>: <span class="miss">${f.join(', ')}</span></li>`).join('') + '</ul>'
    : '<div>every field the style reads is present</div>');

  const onlyRemote = [], fieldDiff = [];
  for (const [layer, fields] of remote) {
    if (!local.has(layer)) { onlyRemote.push(layer); continue; }
    const gone = [...fields].filter((f) => !/^name[:_]/.test(f) && !local.get(layer).has(f));
    if (gone.length) fieldDiff.push([layer, gone]);
  }
  const onlyLocal = [...local.keys()].filter((l) => !remote.has(l));
  html.push('<h3>schema diff, openfreemap vs local (ignoring what the style reads)</h3>');
  html.push(`<div>only openfreemap: ${onlyRemote.length ? onlyRemote.join(', ') : '—'}</div>`);
  html.push(`<div>only local: ${onlyLocal.length ? onlyLocal.join(', ') : '—'}</div>`);
  html.push(fieldDiff.length
    ? '<ul>' + fieldDiff.map(([l, f]) => `<li><code>${l}</code> lacks: ${f.join(', ')}</li>`).join('') + '</ul>'
    : '<div>no field differs</div>');

  el.innerHTML = html.join('');
}

/** the line every pane prints, so a camera can be compared across renderers at a glance. */
function cameraLine(zoom, lon, lat, bearing, pitch) {
  return `z ${zoom.toFixed(2)}  ${lon.toFixed(5)}, ${lat.toFixed(5)}` +
    `  rot ${bearing.toFixed(1)}  tilt ${pitch.toFixed(1)}`;
}

// Its own source, not the style's hillshade one: maplibre warns when one DEM drives both.
const TERRAIN_DEM = { type: 'raster-dem', tiles: ['https://tiles.mapterhorn.com/{z}/{x}/{y}.webp'],
                      encoding: 'terrarium', tileSize: 512, maxzoom: 16 };

// From `load` on: isStyleLoaded() stays false while any tile is still on its way.
function applyTerrain(map) {
  if (!map._terrainReady) return;
  if (!$('terrain').checked) { map.setTerrain(null); return; }
  if (!map.getSource('preview-dem')) map.addSource('preview-dem', TERRAIN_DEM);
  map.setTerrain({ source: 'preview-dem', exaggeration: 1 });
}

function makeMap(container, style, errEl, readout) {
  const map = new maplibregl.Map({ container, style, ...START, maxPitch: 85, hash: false,
                                      attributionControl: false });
  const show = () => {
    const c = map.getCenter();
    readout.textContent = cameraLine(map.getZoom(), c.lng, c.lat, map.getBearing(), map.getPitch());
  };
  map.on('move', show);
  map.on('load', show);
  map.on('load', () => { map._terrainReady = true; applyTerrain(map); });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
  // Kept on the map: an observer nothing holds a reference to is collectable, and once collected
  // it stops observing - which left the canvas at its old height when the Massif row opened.
  map._paneObserver = new ResizeObserver(() => map.resize());
  map._paneObserver.observe(document.getElementById(container));
  const seen = new Set();
  map.on('error', (e) => {
    const msg = (e && e.error && e.error.message) || String(e);
    // a style written for two tilesets reads layers only one carries; the gaps panel lists those
    if (seen.has(msg) || /does not exist on source/.test(msg)) return;
    seen.add(msg);
    errEl.style.display = 'block';
    errEl.textContent = [...seen].slice(-8).join('\n');
  });
  return map;
}

let maps = [];
function sync(a, b) {
  let guard = false;
  const copy = (from, to) => {
    if (guard || !$('sync').checked) return;
    guard = true;
    to.jumpTo({ center: from.getCenter(), zoom: from.getZoom(),
                bearing: from.getBearing(), pitch: from.getPitch() });
    guard = false;
  };
  a.on('move', () => copy(a, b));
  b.on('move', () => copy(b, a));
}

async function boot() {
  // here, not at load: the browser restores a checkbox's last state over the one the script set
  $('terrain').checked = ASKED.get('terrain') === '1';
  const asked = ASKED.get('style');
  if (asked) $('style-url').value = asked;
  const sets = tilesets = await (await fetch(ORIGIN + '/tilesets.json')).json();
  const sel = $('local-set');
  sel.innerHTML = Object.keys(sets).map((n) => `<option value="${n}">${n}</option>`).join('');
  localName = Object.keys(sets)[0];
  if (!localName) { $('err-r').style.display = 'block'; $('err-r').textContent = 'serve.py has no --mbtiles registered'; }
  sel.onchange = () => { localName = sel.value; load(); };
  await load();
  setupVariant();
  if (ASKED.get('hour')) { $('hour').value = ASKED.get('hour'); postHour(); }
  if (ASKED.get('ref')) { $('ref').value = ASKED.get('ref'); showRef(); }
  if (ASKED.get('massif') === '1') $('massif-toggle').onclick();
}

/** A Massif style is one file per variant beside the others: switching reloads on the sibling. */
function setupVariant() {
  const url = $('style-url').value.trim();
  const match = url.match(/\/styles\/massif\/([a-z]+)\.json$/);
  if (!match) return;
  const sel = $('variant');
  sel.style.display = '';
  // the example projects extend the family, drawn from the streets variant
  const EXAMPLES = ['custom', 'osm'];
  sel.value = EXAMPLES.includes(ASKED.get('project')) ? ASKED.get('project') : match[1];
  sel.onchange = () => {
    const next = new URL(location.href);
    const c = maps[0].getCenter();
    const example = EXAMPLES.includes(sel.value);
    next.searchParams.set('style', url.replace(/[a-z]+\.json$/, (example ? 'streets' : sel.value) + '.json'));
    if (example) next.searchParams.set('project', sel.value); else next.searchParams.delete('project');
    next.searchParams.set('lon', c.lng.toFixed(5));
    next.searchParams.set('lat', c.lat.toFixed(5));
    next.searchParams.set('zoom', maps[0].getZoom().toFixed(2));
    next.searchParams.set('tilt', maps[0].getPitch().toFixed(1));
    next.searchParams.set('rot', maps[0].getBearing().toFixed(1));
    next.searchParams.set('hour', $('hour').value);
    if ($('ref').value) next.searchParams.set('ref', $('ref').value);
    if (massifStarted) next.searchParams.set('massif', '1');
    if ($('shadows').checked) next.searchParams.set('shadows', '1'); else next.searchParams.delete('shadows');
    if ($('terrain').checked) next.searchParams.set('terrain', '1'); else next.searchParams.delete('terrain');
    if ($('poiroof').checked) next.searchParams.delete('poiroof'); else next.searchParams.set('poiroof', '0');
    location.href = next.href;
  };
}

async function load() {
  const url = $('style-url').value.trim();
  styleJSON = await (await fetch(url)).json();
  // the style is handed over as an object, so nothing else is left to resolve its relative URLs
  for (const key of ['sprite', 'glyphs']) {
    const v = styleJSON[key];
    if (typeof v === 'string' && !/^([a-z]+:)?\/\//i.test(v)) {
      styleJSON[key] = new URL(v, url).href;
    }
  }
  // a source named by a bare file (`bathymap.json`) has no public host: it is one of ours, served here
  for (const [name, src] of Object.entries(styleJSON.sources || {})) {
    if (src.url && !/^([a-z]+:)?\/\//i.test(src.url) && tilesets[name]) src.url = ORIGIN + '/tiles/' + name + '.json';
  }
  const localURL = ORIGIN + '/tiles/' + localName + '.json';
  const remoteURL = firstVectorURL(styleJSON);

  const camera = maps.length ? { center: maps[0].getCenter(), zoom: maps[0].getZoom(),
                                 bearing: maps[0].getBearing(), pitch: maps[0].getPitch() } : null;
  for (const m of maps) m.remove();
  maps = [makeMap('map-l', styleJSON, $('err-l'), $('ro-l')),
          makeMap('map-r', retarget(styleJSON, localURL), $('err-r'), $('ro-r'))];
  if (camera) maps.forEach((m) => m.jumpTo(camera));
  sync(maps[0], maps[1]);
  maps[0].on('move', postCamera);
  $('tag-l').textContent = 'openfreemap — ' + (remoteURL || 'style default');
  $('tag-r').textContent = 'local — ' + localName;

  [localTileJSON, remoteTileJSON] = await Promise.all([
    fetch(localURL).then((r) => r.json()).catch(() => null),
    remoteURL ? fetch(remoteURL).then((r) => r.json()).catch(() => null) : null,
  ]);
  if ($('gaps').style.display === 'block') renderGaps();
}

function firstVectorURL(style) {
  for (const src of Object.values(style.sources || {})) {
    if (src.type === 'vector' && src.url) return src.url;
  }
  return null;
}

/**
 * The Massif row, off until asked for: it is two wasm modules and a tile pool each. The panes read
 * the CartoCSS the converter wrote from this same style, so the row below answers "and what does
 * the device make of it" for whatever the row above is showing.
 */
let massifStarted = false;
let imageryURL = null;
async function startMassif() {
  // a hybrid's imagery is an app layer on the SDK too: the pane gets the raster's tile URL
  const raster = (styleJSON.layers || []).find((l) => l.type === 'raster' && l.metadata?.['massif:sdk-layer']);
  const src = raster && styleJSON.sources?.[raster.source];
  imageryURL = src ? (src.tiles?.[0] ?? (await (await fetch(src.url)).json()).tiles?.[0]) : null;
  // ?carto= names another conversion of the same style - one built without --fold-casings, say -
  // so two runs of the converter can be compared over the same tiles without editing anything.
  const asked = ASKED.get('carto');
  const base = new URL(asked ?? 'carto', $('style-url').value.trim()).href;
  const centre = maps[0].getCenter();
  const tilesets = [remoteTileJSON, localTileJSON];
  // ?compare=<project folder URL>[&compareVariant=<name>] puts another CartoCSS project in the left
  // pane, over the LOCAL tiles: a release flavour, an older build, another app's style.
  const compare = ASKED.get('compare');
  for (const [i, id] of ['massif-l', 'massif-r'].entries()) {
    const side = compare && i === 0 ? 1 : i;
    const source = firstVectorTileURL(tilesets[side]);
    if (!source) continue;
    // `carto`, not `project`: the web demo reads `project` off the query string itself, and would
    // take this URL for a folder name in its own filesystem. maxzoom is not optional - without it
    // the SDK asks for a tile deeper than the tileset goes instead of overzooming the last one.
    const imagery = imageryURL;
    const query = new URLSearchParams({
      pane: id, carto: compare && i === 0 ? new URL(compare, location.href).href : base, source,
      minzoom: tilesets[side].minzoom ?? 0, maxzoom: tilesets[side].maxzoom ?? 14,
      // The pane is handed a MapLibre camera, so it adopts MapLibre's conventions: the 512-pixel
      // tile the zoom NUMBER is calibrated on, and the refinement density the SDK otherwise sets a
      // full level finer. The dpi it reads off the display is already right - measured against
      // maplibre at one camera, both draw 4831.1 CSS pixels to the degree. ?dpi= overrides it.
      // ?tiledrawsize=256 runs the row as an app left on the SDK default, the zoom renumbered to match.
      tiledrawsize: ASKED.get('tiledrawsize') ?? 512, zoomoffset: Math.log2(512 / Number(ASKED.get('tiledrawsize') ?? 512)),
      tilelodfactor: 1,
      dpi: ASKED.get('dpi') ?? 0,
      // ?blendspeed=0 turns the tile cross-fade off, which is what maplibre does with vector
      // geometry. A cased road fades badly: its fill is near the background colour, so early in
      // the fade only the casing reads and the road looks like an outline waiting to be filled.
      blendspeed: ASKED.get('blendspeed') ?? 1,
      // ?labelperspective=0 holds a label at a constant screen size however far away it is, which
      // is what this SDK did before; 0.5 is maplibre's own damping, and what the row compares to.
      labelperspective: ASKED.get('labelperspective') ?? 0.5,
      lon: centre.lng, lat: centre.lat, zoom: maps[0].getZoom(),
      // The pane starts at the camera the URL asked for, not at north-up nadir: sync only fires
      // on a MOVE, so ?tilt= would otherwise not reach the massif row until something dragged.
      tilt: maps[0].getPitch(), rot: maps[0].getBearing(),
      hour: $('hour').value,
      ...(standardRef() ? { standardsun: 1 } : {}),
      // a family project holds every variant; the style says which one it is
      // ?project=custom|osm loads carto/<project>.json, a child project, in place of the style's variant
      ...(compare && i === 0 ? (ASKED.get('compareVariant') ? { variant: ASKED.get('compareVariant') } : {})
        : ASKED.get('project') ? { variant: ASKED.get('project') }
        : styleJSON.metadata?.['massif:variant'] ? { variant: styleJSON.metadata['massif:variant'] } : {}),
      // the relief is an app layer on the SDK; the style says how to set one up
      ...hillshadeOf(styleJSON),
      ...(imagery ? { imagery } : {}),
      // off, no terrain for the building shadows to land on
      shadows: $('shadows').checked ? 1 : 0,
      // not `terrain`: the web demo reads that one itself, as the URL of a DEM
      ...($('terrain').checked ? { relief: 1 } : {}),
      // ?styleparams=poi_on_roof=0,label_occlusion=0: the style's own parameters, SDK panes only
      ...(styleParams() ? { styleparams: styleParams() } : {}),
    });
    $(id).src = `./massif-pane.html?${query}`;
  }
  if (compare) $('tag-ml').textContent = `compare — ${compare}${ASKED.get('compareVariant') ? ' / ' + ASKED.get('compareVariant') : ''} (local tiles)`;
  massifStarted = true;
}

/** A reference style in the local pane's slot, fed the same camera as the massif row. */
function showRef() {
  const ref = $('ref').value;
  $('map-r').parentElement.classList.toggle('hidden', !!ref);
  $('pane-ref').classList.toggle('hidden', !ref);
  for (const m of maps) m.resize();
  if (!ref) { $('ref-frame').src = 'about:blank'; return; }
  const c = maps[0].getCenter();
  $('tag-ref').textContent = 'reference — ' + ref;
  $('ref-frame').src = './ref-pane.html?' + new URLSearchParams({
    ref, lon: c.lng, lat: c.lat, zoom: maps[0].getZoom(), pitch: maps[0].getPitch(),
    bearing: maps[0].getBearing(), preset: ASKED.get('preset') ?? presetOf(Number($('hour').value)),
    terrain: $('terrain').checked ? 1 : 0 });
}

/** Mapbox Standard's four presets over the hour, for the reference pane. */
function presetOf(hour) {
  return hour < 6 || hour >= 20.5 ? 'night' : hour < 8 ? 'dawn' : hour >= 18 ? 'dusk' : 'day';
}

// The SDK panes take Standard's day sun only beside the Standard reference (see massif-pane.html setHour).
function standardRef() {
  return $('ref').value.startsWith('mapbox-standard');
}

function postHour() {
  const hour = Number($('hour').value);
  $('hour-v').textContent = `${Math.floor(hour)}:${String(Math.round((hour % 1) * 60)).padStart(2, '0')}`;
  for (const id of ['massif-l', 'massif-r']) {
    const frame = $(id).contentWindow;
    if (frame) frame.postMessage({ massifStandardSun: standardRef(), massifHour: hour }, '*');
  }
  const ref = $('ref-frame').contentWindow;
  if (ref) ref.postMessage({ refPreset: presetOf(hour) }, '*');
}

function postCamera() {
  if (!$('sync').checked) return;
  const to = { center: maps[0].getCenter().toArray(), zoom: maps[0].getZoom(),
               bearing: maps[0].getBearing(), pitch: maps[0].getPitch() };
  for (const id of ['massif-l', 'massif-r', 'ref-frame']) {
    const frame = $(id).contentWindow;
    if (frame) frame.postMessage({ massifCamera: to }, '*');
  }
}

/** A style's hillshade as the SDK pane builds it: its DEM, and the layer settings it states. A hidden one
 *  (Massif's relief outside outdoor and topo) is left for an app to turn on. */
function hillshadeOf(style) {
  const layer = (style.layers || []).find((l) => l.type === 'hillshade' && l.metadata?.['massif:sdk-layer']
    && l.layout?.visibility !== 'none');
  const source = layer && style.sources?.[layer.source];
  const dem = source?.tiles?.[0];
  // MapLibre's own default encoding; the SDK needs it named, or it reads Terrarium as Terrain-RGB (25.6x the slope)
  return dem ? { dem, demMaxZoom: source.maxzoom ?? 22, demEncoding: source.encoding ?? 'mapbox',
    hillshade: JSON.stringify(layer.metadata['massif:sdk-layer']) } : {};
}

function firstVectorTileURL(tilejson) {
  return tilejson && tilejson.tiles && tilejson.tiles[0];
}

$('massif-toggle').onclick = () => {
  const grid = $('maps');
  if (massifStarted) {
    grid.classList.toggle('rows');
    for (const id of ['pane-ml', 'pane-mr']) $(id).classList.toggle('hidden');
    for (const m of maps) m.resize();
    return;
  }
  grid.classList.add('rows');
  for (const id of ['pane-ml', 'pane-mr']) $(id).classList.remove('hidden');
  // The grid just halved the MapLibre panes. Told rather than observed: a ResizeObserver does not
  // run while the pane is hidden, and a map left at its old height draws off the bottom of its box.
  for (const m of maps) m.resize();
  startMassif();
};

function styleParams() {
  return [ASKED.get('styleparams'), $('poiroof').checked ? null : 'poi_on_roof=0'].filter(Boolean).join(',');
}

$('reload').onclick = load;
$('ref').onchange = () => { showRef(); postHour(); };
$('shadows').checked = ASKED.get('shadows') === '1';
// Posted to the running panes: a pane restart reloads the whole SDK.
const postToMassif = (message) => {
  for (const id of ['massif-l', 'massif-r']) {
    const frame = $(id);
    if (frame && frame.contentWindow) frame.contentWindow.postMessage(message, '*');
  }
};
const postScene = () => postToMassif({ massifScene: { relief: $('terrain').checked, shadows: $('shadows').checked } });
$('shadows').onchange = postScene;
$('poiroof').checked = ASKED.get('poiroof') !== '0';
$('poiroof').onchange = () => postToMassif({ massifStyleParams: `poi_on_roof=${$('poiroof').checked ? 1 : 0}` });
$('terrain').onchange = () => {
  maps.forEach(applyTerrain);
  const ref = $('ref-frame').contentWindow;
  if (ref) ref.postMessage({ refTerrain: $('terrain').checked }, '*');
  postScene();
};
$('hour').oninput = postHour;
$('fit').onclick = () => {
  if (!localTileJSON || !localTileJSON.bounds) return;
  maps.forEach((m) => m.fitBounds(localTileJSON.bounds, { duration: 0 }));
};
$('gaps-toggle').onclick = () => {
  const el = $('gaps');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
  if (el.style.display === 'block') renderGaps();
};

boot();
</script>
</body>
</html>
