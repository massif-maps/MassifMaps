<!doctype html>
<meta charset="utf-8">
<title>peak finder bench</title>
<style>
  html, body { margin: 0; height: 100%; background: #f7f7f4; }
  #map { width: 100vw; height: 100vh; display: block; }
  /* ?split=1: the reference on the left, ours on the right, one camera driving both. Served from
     this origin (web/geo-three -> geo-three/example) so its setPosition/setAzimuth are callable -
     cross-origin the frame can be shown but not steered, which makes the comparison worthless. */
  body.split #map { width: 50vw; position: absolute; right: 0; top: 0; }
  body.split #ref { position: absolute; left: 0; top: 0; width: 50vw; height: 100vh; border: 0;
                    border-right: 1px solid #888; }
  #ref { display: none; }
  body.split #ref { display: block; }
  body.split #panel { top: auto; bottom: 8px; }
  #hud { position: fixed; top: 8px; left: 8px; font: 12px/1.4 monospace; background: #fffc;
         padding: 6px 8px; white-space: pre; }
  /* The tuning panel. Hidden from a capture (?panel=0) so a screenshot is the render and nothing
     else, and every control writes the query string back so a tuned look is a LINK. */
  #panel { position: fixed; top: 8px; right: 8px; width: 250px; max-height: 92vh; overflow: auto;
           font: 11px/1.5 monospace; background: #fffe; padding: 8px; }
  #panel h4 { margin: 8px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  #panel label { display: block; margin-bottom: 4px; }
  #panel .row { display: flex; align-items: center; gap: 6px; }
  #panel input[type=range] { flex: 1; min-width: 0; }
  #panel .val { width: 52px; text-align: right; }
  #panel a { display: block; margin-top: 8px; word-break: break-all; }
  body.no-panel #panel { display: none; }
  /* Present in the DOM even when invisible, so --dump-dom reads it without disturbing a screenshot. */
  #log { position: fixed; bottom: 0; left: 0; right: 0; max-height: 34vh; overflow: auto; margin: 0;
         font: 10px/1.3 monospace; background: #000c; color: #0f0; padding: 6px; display: none; }
  body.show-log #log { display: block; }
</style>
<canvas id="map"></canvas>
<iframe id="ref"></iframe>
<div id="hud"></div>
<div id="panel"></div>
<pre id="log"></pre>
<script>
  // A headless run has no console to read, and the SDK reports a shader that failed to compile
  // through Log::Errorf - i.e. console. Mirroring it into the DOM is what makes --dump-dom a
  // diagnostic: the page can be asked what went wrong without a debugger attached.
  globalThis.__log = [];
  for (const level of ['log', 'info', 'warn', 'error']) {
    const original = console[level].bind(console);
    console[level] = (...args) => {
      globalThis.__log.push(level + ': ' + args.map((a) => String(a?.stack ?? a)).join(' '));
      original(...args);
    };
  }
  // "no tiles this frame" has two very different causes - the layer asked for nothing, or it asked
  // and the request failed. Counting requests by host separates them without a debugger.
  globalThis.__net = { count: 0, byHost: {}, status: {}, last: [] };
  const note = (url, tag) => {
    const net = globalThis.__net;
    let host = 'relative';
    try { host = new URL(url, location.href).host; } catch (error) { /* opaque url */ }
    net.count += 1;
    net.byHost[host] = (net.byHost[host] ?? 0) + 1;
    net.status[tag] = (net.status[tag] ?? 0) + 1;
    if (net.last.length < 40) { net.last.push(tag + ' ' + String(url).slice(0, 140)); }
  };
  // Bound: an unbound window.fetch throws "Illegal invocation", which kills the wasm load itself.
  const originalFetch = globalThis.fetch.bind(globalThis);
  globalThis.fetch = (input, init) => {
    const url = typeof input === 'string' ? input : input?.url;
    note(url, 'fetch');
    return originalFetch(input, init).then((r) => { note(url, 'fetch:' + r.status); return r; },
      (e) => { note(url, 'fetch:ERR'); throw e; });
  };
  if (new URLSearchParams(location.search).get('xhrtrace')) {
    const originalOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url, ...rest) {
      note(url, 'xhr');
      this.addEventListener('load', () => note(url, 'xhr:' + this.status));
      this.addEventListener('error', () => note(url, 'xhr:ERR'));
      return originalOpen.call(this, method, url, ...rest);
    };
  }
  addEventListener('error', (e) => globalThis.__log.push('window.error: ' + (e.error?.stack ?? e.message)));
  addEventListener('unhandledrejection', (e) => globalThis.__log.push('reject: ' + (e.reason?.stack ?? e.reason)));
</script>
<script src="./coi-serviceworker.js"></script>
<script type="module">
  /*
   * The peak finder, in a browser.
   *
   * Why: its faults are RUN TO RUN - the same tile renders differently on different openings - and
   * on device a single comparison costs a native build, an install, hand navigation and a screenshot
   * read by eye. Here a run is a page load, the camera is scripted, and two runs can be diffed.
   *
   * The shaders are GENERATED from alpimaps' reliefShaders.ts (gen-relief-shaders.mjs), so this is
   * the same source the app ships, not a copy that will drift.
   */
  import { Massif, MassifCamera } from '../js/massif.mjs';
  import { RELIEF_SURFACE_SHADER, RELIEF_OUTLINE_SHADER, RELIEF_DEPTH_OUTLINE_SHADER } from './relief-shaders.js';

  const query = new URLSearchParams(location.search);
  if (query.get('log')) { document.body.classList.add('show-log'); }
  const num = (name, fallback) => (query.has(name) ? parseFloat(query.get(name)) : fallback);

  // Grenoble, the viewpoint the device reports the fault at.
  const LAT = num('lat', 45.1885);
  const LON = num('lon', 5.7245);
  // THE SAME DEM THE REFERENCE READS, at the same max zoom. geo-three's LocalHeightProvider is
  // s3 elevation-tiles-prod terrarium with heightMaxZoom 15; mapterhorn's planet archive stops at
  // z12, which is three levels - 8x - coarser height data, and that is most of why our folds read
  // softer than the reference's however fine the mesh grid is. ?terrain= overrides.
  const DEM = query.get('terrain') ??
    'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';

  // NO TILE LAYER by default. A draped raster or vector layer paints the terrain itself, so the
  // surface shader's output never reaches the screen and every surface parameter reads as a no-op -
  // which is how a post-process tuned to be the whole picture got mistaken for a shading bug.
  // ?source=<url> puts one back.
  globalThis.MASSIF_DEFAULTS = { terrain: DEM, lat: LAT, lon: LON, zoom: num('zoom', 13), source: 'none',
    terrainMaxZoom: num('terrainMaxZoom', 15),
    // Read by main() at init, which is the only time the mesh grid can be set: the meshes and the
    // tile transformer both capture it when they are built. 512 is the reference's geometrySize.
    meshResolution: num('meshResolution', 512),
    // Init-time too: a stitched mesh is a different mesh, and the cache holds the one it was built
    // as. Setting this after the fact changed 0 pixels.
    tileEdgeStitching: num('tileEdgeStitching', 1) };

  const { default: Module } = await import('./massif-demo.mjs');
  const module = await Module({ canvas: document.getElementById('map') });
  const massif = new Massif(module);
  const camera = await MassifCamera.attach(massif);

  const str = (fn, text) => module.ccall(fn, null, ['string'], [text]);
  const param = (fn, name, value) => module.ccall(fn, null, ['string', 'number'], [name, value]);

  // The SDK supplies uColorTex, uTerrainDepthTex, uFar, uNear, uInvScreenSize and uProjInvScale.
  // Everything else the shader declares has to be fed, or it reads zero - which is its own class of
  // bug and exactly the kind this bench exists to avoid re-creating by hand.
  const INK = {
    uIntensity: 1, uOutlineWidth: 1, uHorizonBoost: 1, uDepthThreshold: 1,
    // The depth-only outline's own, and the numbers the render is judged against. The slope term
    // this operator returns everywhere is NOT an artefact - it is the hillshade, and the reference
    // leans on the same thing (geo-three: gain 11, power 0.23). uOutlineFloor turns it into a pure
    // edge detector instead; 0 keeps the reference look. ?ink.uOutlineFloor=0.05 to see the other.
    uOutlineGain: 11, uOutlinePower: 0.6, uOutlineFloor: 0,
    // The skyline, which a depth operator cannot draw: the sky is not in the depth buffer, so the
    // ridge against it comes out the weight of an interior fold. Its own width, so it is a fatter
    // stroke and not just a darker one.
    uHorizonWidth: 3,
    uCreaseStrength: 0, uCreaseThreshold: 0.12,
    uRidgeStrength: 2, uRidgeThreshold: 0.05, uRidgeGroundSpan: 90,
    uTransparent: 0, uDepthTexelSize: 2, uGrazingFloor: 0.15,
    // The far fade goes to a FLOOR, not to zero: the ridges a peak finder names are the ones past
    // uInkDistance, and the old 1 - dist/uInkDistance erased them exactly there.
    uInkDistance: 50000, uInkFar: 0.45, uInkFalloff: 1.6,
    // The camera range the outline measures depth over, metres. 0 keeps our own relative operator
    // (divide by the depth); ?look=geothree sets the reference's 10 .. 173000.
    uDepthNear: 0, uDepthFar: 0,
    uInkShadeCap: 0, uDebugView: num('debug', 0),
    uMetersPerUnit: 40075016.68558 / (1 << 20), uSilhouetteGate: 865,
    // No haze: the far ranges are the point of a panorama, and fading them into the paper is what
    // hid them. ?ink.uHaze=0.65 puts the aerial perspective back.
    uHazeDistance: 60000, uHaze: 0,
    uDistortK1: 0, uDistortK2: 0, uDistortK3: 0, uDistortP1: 0, uDistortP2: 0,
    uDistortCenterX: 0.5, uDistortCenterY: 0.5,
    uDistortScreenTanX: 1, uDistortScreenTanY: 1,
    uDistortRenderTanX: 1, uDistortRenderTanY: 1, uDistortRotate: 0
  };
  const SURFACE = {
    // The hillshade the surface pass draws, deliberately faint: the outline's slope term already
    // carries the relief, and a second full-strength one on top of it doubles every hillside.
    uShadeStrength: 0.18, uSlopeShade: 0.22, uAmbient: 0.35,
    uHaze: 0, uHazeDistance: 60000, uDebugView: num('debug', 0),
    // The ridge ink, drawn by the surface pass at full resolution. OFF: at every strength tried it
    // draws blobs rather than crests - the laplacian over a 120 m span aliases against the DEM texel
    // grid - and the depth outline already draws the interior folds. ?s.uRidgeInkStrength=1 to look.
    uRidgeInkStrength: 0, uRidgeInkSpan: 120, uRidgeInkThreshold: 0.15
  };
  const TERRAIN = {
    normalSampleDistance: num('normalSampleDistance', 90),
    meshResolution: num('meshResolution', 256),
    meshCacheSize: num('meshCacheSize', 640),
    surfaceNodeResolution: num('surfaceNodeResolution', 0),
    sharedGround: 0,
    // ON. It was off, and the breaks between tiles at different levels are exactly what it exists
    // to close - a skirt hides the gap but not the step in the surface across it.
    tileEdgeStitching: num('tileEdgeStitching', 1)
  };

  // ?look=geothree is the REFERENCE PIPELINE, ported term for term rather than approximated:
  //
  //   - the surface is FLAT LIT. geo-three's example has AmbientLight alone (dayNightCycle is off,
  //     so its sun and its shadow map are never constructed), so its material returns albedo x
  //     ambient and every bit of relief in its picture comes from the outline.
  //   - the outline measures a LINEAR depth over the camera's near..far, 10 m .. 173 km, with no
  //     division by anything. Ours divides by a far plane that reaches 1229 km in a panorama, which
  //     is why its depthMultiplier of 11 never meant the same thing here.
  //   - BlendFunction.AVERAGE halves the effect against the input, so its uniforms land at half the
  //     strength they read. uIntensity 0.5.
  //   - geometrySize 512, its mesh resolution.
  //   - depthMultiplier 11, depthBiais 0.23 (the power), outlineStroke 1.
  //
  // NOT its exageration of 1.6225, by request: the terrain is rendered true.
  if (query.get('look') === 'geothree') {
    Object.assign(INK, {
      // THEIR NUMBERS, unchanged: depthMultiplier 11, depthBiais 0.23, outlineStroke 1, and
      // uIntensity 0.5 for the BlendFunction.AVERAGE that halves the effect against the input.
      // A previous revision "calibrated" the gain to 60 because 11 looked faint - that was
      // calibrating against OUR old render, not against the reference, which is light: captured
      // side by side at this viewpoint the reference is mean luminance 243 with 1.7% of it below
      // mid-grey, and gain 60 gave 127 and 39%. At 11 it is 177 and 17%.
      uOutlineGain: 11, uOutlinePower: 0.23, uOutlineFloor: 0, uOutlineWidth: 1,
      uIntensity: 0.5, uDepthNear: 10, uDepthFar: 173000,
      // No distance fade: the reference has none, and a fade is the first thing that makes two
      // renders diverge at exactly the range this is being compared over.
      uInkFar: 1, uInkFalloff: 1,
      // The one deliberate DEVIATION, by request: the reference draws the skyline no heavier than
      // an interior fold, and a panorama wants it heavier.
      uHorizonBoost: 1, uHorizonWidth: 3
    });
    Object.assign(SURFACE, { uShadeStrength: 0, uSlopeShade: 0, uRidgeInkStrength: 0 });
    // Its geometrySize is 512. WE CANNOT MATCH IT: setMeshResolution clamps to 256, and the
    // surface mesh reads getMeshResolution (TerrainRenderer.cpp:878), not surfaceNodeResolution -
    // setting the latter to 512 changed 0 pixels. Left at the default; raising the ceiling is an
    // SDK change, and it is the reason our folds are softer than the reference's.
    TERRAIN.meshResolution = 256;
  }

  // Any uniform can be overridden from the query string, so a tuned look is a LINK rather than a
  // list of console calls to retype: ink.uRidgeStrength=6, s.uShadeStrength=0.10, t.meshResolution=256.
  for (const [key, value] of query) {
    const [scope, name] = [key.slice(0, key.indexOf('.')), key.slice(key.indexOf('.') + 1)];
    const target = scope === 'ink' ? INK : scope === 's' ? SURFACE : scope === 't' ? TERRAIN : null;
    if (target && name) {
      target[name] = parseFloat(value);
    }
  }

  // ?ink=depth is the geo-three-shaped pipeline: the surface shades and inks the ridges at full
  // resolution off the elevation texture, and the post-process draws silhouettes from 24-bit depth
  // and nothing else. ?ink=normals is the old one, kept so the two can be compared in one build.
  const inkMode = query.get('ink') ?? 'depth';

  // No SDK fog: the surface shader draws the aerial perspective itself, over its own distance, so
  // the frame's haze on top of it is a second wash. ?fog=1 puts it back.
  module.ccall('massifSetFogEnabled', null, ['number'], [query.get('fog') === '1' ? 1 : 0]);
  // Paper, not transparent: see massifSetTerrainBackground. ?background=0 turns it off to see the
  // state it fixes.
  if (query.get('background') !== '0') {
    module.ccall('massifSetTerrainBackground', null, ['number', 'number', 'number', 'number'], [247, 247, 244, 255]);
  }

  function applyAll() {
    str('massifSetSurfaceShader', RELIEF_SURFACE_SHADER);
    module.ccall('massifSetReliefNormals', null, ['number'], [inkMode === 'depth' ? 0 : 1]);
    str('massifSetReliefShader', inkMode === 'depth' ? RELIEF_DEPTH_OUTLINE_SHADER : RELIEF_OUTLINE_SHADER);
    for (const [k, v] of Object.entries(TERRAIN)) param('massifSetTerrainFloat', k, v);
    for (const [k, v] of Object.entries(SURFACE)) param('massifSetSurfaceParam', k, v);
    for (const [k, v] of Object.entries(INK)) param('massifSetReliefParam', k, v);
  }
  applyAll();

  // THE TILT RANGE FIRST. A map clamps tilt to something like 30..90 because it is a map; a
  // panorama looks at the HORIZON, which is a tilt of a few degrees, and flyTo silently lands on the
  // clamp instead - the first capture came back at 84.3 asking for 4.
  // A panorama is a near-horizontal camera, not a tilted map: tilt 90 is straight down, so the
  // horizon is a SMALL number - and the map's own tilt range clamps it, which is why the first
  // capture came back at 84.3 having been asked for 4. The hook widens the range and places the
  // CAMERA (not the focus point) at the viewpoint, which is what first-person means.
  // FIRST PERSON FIRST, then the camera. This is the control scheme the panorama is about and the
  // one the app uses: the position IS the eye, a drag turns the view about it, and the eye never
  // moves. ?roam=0 restores the map gestures, ?roam=1 is the orbiting 'look' mode.
  module.ccall('massifSetFreeRoamMode', null, ['number'], [num('roam', 2)]);
  module.ccall('massifSetPanoramaCamera', null,
    ['number', 'number', 'number', 'number', 'number', 'number'],
    [LON, LAT, num('zoom', 13), num('rotation', 0), num('tilt', 4), num('elevation', 50)]);

  // Field of view is an Options attribute the facade already carries, so it needs no C hook - and it
  // is the first thing to match against a reference panorama. The SDK's default is a map's wide
  // angle; peakfinder frames about 46 degrees, which is most of why the same ground looks small here.
  const optionsHandle = massif.find('options', 'map');
  const setFov = (degrees) => massif.set(optionsHandle, 'fieldOfViewY', degrees);
  setFov(num('fov', 46));

  // Assigned once the split is set up; a no-op until then. `let`, not a const declared later: a
  // const in its temporal dead zone throws on `typeof`, so setCamera could not guard on it.
  let syncRef = () => false;
  let lastRotation = num('rotation', 0);
  let lastTilt = num('tilt', 4);
  let eyeMetres = num('elevation', 50);
  const setCamera = (rotation, tilt) => {
    lastRotation = rotation;
    lastTilt = tilt;
    module.ccall('massifSetPanoramaCamera', null,
      ['number', 'number', 'number', 'number', 'number', 'number'],
      [LON, LAT, num('zoom', 13), rotation, tilt, eyeMetres]);
    // The reference follows every camera change, so the split never drifts out of step.
    syncRef();
  };

  // AFTER the camera is placed. First person changes what moving the camera MEANS - setTilt and
  // setMapRotation turn the view in place rather than orbiting a focus point - so switching it on
  // first left massifSetPanoramaCamera aiming at nothing (focus z -12232).
  // ?roam=0 restores the map gestures, ?roam=1 is the orbiting 'look' mode.
  // ?roam=2 is FIRST PERSON - a drag turns the view about the camera and the position never moves.
  // OPT-IN, not the default: switching the camera model moves the eye, and massifSetPanoramaCamera
  // does not yet co-operate with it - in either order the eye lands below the ground looking into a
  // wall of skirts (focus z -328 setting it after, -12232 before). The mode itself works; placing
  // the camera under it is what still needs doing.
  // No sky: a panorama is read against the paper, and every band above the horizon is something
  // drawn. ?sky=1 puts it back.
  if (query.get('sky') !== '1') {
    module.ccall('massifSetSkyEnabled', null, ['number', 'number', 'number', 'number'], [0, 255, 255, 255]);
  }

  // The eye's height, the panorama's one viewpoint control. Re-places the camera rather than
  // touching focusLift: massifSetPanoramaCamera owns the height here, and using both lifts twice.
  // focusLift, not a camera re-placement: in first person the renderer reads it every frame, so
  // this is the live control and nothing else has to move.
  const setEye = (metres) => {
    eyeMetres = Math.max(0, metres);
    module.ccall('massifSetFocusLift', null, ['number'], [eyeMetres]);
    syncRef();
  };


  // THE REFERENCE, SIDE BY SIDE, ON ONE CAMERA (?split=1).
  //
  // Comparing two renders from two screenshots taken by hand is how four rounds of "still not the
  // same" happened: the viewpoint, the field of view and the load state all differ a little and any
  // of the three can explain a difference on its own. Here both are on screen at once and the same
  // numbers drive both, so what is left is the renderer.
  //
  // Same origin (web/geo-three -> geo-three/example) is not a convenience: the reference takes its
  // camera from window.setPosition/setAzimuth, so cross-origin the frame could be shown but never
  // steered. Its settings are also all query parameters (it JSON.parses every one into `settings`),
  // which is how the field of view and the elevation are matched at load.
  const refFrame = document.getElementById('ref');
  const refReady = () => {
    try { return typeof refFrame.contentWindow?.setPosition === 'function'; }
    catch (error) { return false; }
  };
  syncRef = () => {
    if (!refReady()) { return false; }
    try {
      refFrame.contentWindow.setPosition({ lat: LAT, lon: LON, altitude: eyeMetres });
      // NEGATED. Their azimuth is a HEADING and ours is a map ROTATION, which is its opposite -
      // turning the view right turns the map left. Measured by correlating the two skylines at this
      // viewpoint: +11.22 gives -0.105, -11.22 gives +0.381. Passing it straight through is why the
      // two panes were looking at different mountains.
      refFrame.contentWindow.setAzimuth(-lastRotation);
      return true;
    } catch (error) { return false; }
  };
  if (query.get('split') === '1') {
    document.body.classList.add('split');
    // fovFactor is its field of view, and outline/mesh settings come across too so the two are
    // being compared on the same configuration rather than on its defaults and ours.
    const refQuery = new URLSearchParams({
      elevation: String(eyeMetres),
      fovFactor: String(num('fov', 46)),
      outline: 'true',
      exageration: '1',
      generateColor: 'false',
      dayNightCycle: 'false'
    });
    refFrame.src = '/geo-three/index.html?' + refQuery.toString();
    // It loads its own terrain asynchronously and only exposes setPosition once it has booted, so
    // the sync is retried rather than fired once on load.
    const pump = setInterval(() => { if (syncRef()) { clearInterval(pump); } }, 500);
    setTimeout(() => clearInterval(pump), 30000);
  }

  // Driving surface for experiments: set a parameter, sweep it, or read the camera, from a script or
  // the console. No rebuild, no device.
  Object.assign(globalThis, {
    massif, module, camera, applyAll,
    // Pan away and back. The reported fault survives a return to the same camera - the tile is
    // rebuilt, re-bakes its normals against whatever the cache holds NOW, and lands somewhere else
    // again - so a frame taken before and after a round trip is the test that matters.
    look: (rotation, tilt) => setCamera(rotation, tilt ?? num('tilt', 4)),
    fov: setFov,
    ink: (name, value) => { INK[name] = value; param('massifSetReliefParam', name, value); },
    surface: (name, value) => { SURFACE[name] = value; param('massifSetSurfaceParam', name, value); },
    terrain: (name, value) => { TERRAIN[name] = value; param('massifSetTerrainFloat', name, value); },
    debug: (view) => { globalThis.ink('uDebugView', view); globalThis.surface('uDebugView', view); },
    ready: () => true
  });


  // THE TUNING PANEL. Every number that decides the look, on a slider, writing the query string back
  // as it moves - so a look that works is a LINK to paste rather than a list of values to retype,
  // and the same link reproduces it headless. ?panel=0 hides it for a capture.
  if (query.get('panel') === '0') { document.body.classList.add('no-panel'); }
  const CONTROLS = [
    ['ink', 'uOutlineGain', 0, 80, 1, 'gain'],
    ['ink', 'uOutlinePower', 0.05, 2, 0.01, 'power - low draws the slope wash, high draws lines only'],
    ['ink', 'uOutlineFloor', 0, 0.2, 0.002, 'floor - cuts the slope wash, leaves the steps'],
    ['ink', 'uIntensity', 0, 1, 0.01, 'overall ink'],
    ['ink', 'uOutlineWidth', 1, 4, 1, 'line width, texels'],
    ['ink', 'uHorizonWidth', 1, 8, 1, 'skyline stroke width'],
    ['ink', 'uHorizonBoost', 0, 1, 0.01, 'skyline strength'],
    ['ink', 'uInkDistance', 10000, 300000, 1000, 'where the far fade is complete, m'],
    ['ink', 'uInkFar', 0, 1, 0.01, 'what is LEFT of a line at that distance'],
    ['ink', 'uInkFalloff', 0.2, 4, 0.05, 'fade shape - above 1 holds off then drops'],
    ['ink', 'uDepthNear', 0, 1000, 10, 'depth range near, m'],
    ['ink', 'uDepthFar', 0, 400000, 1000, 'depth range far, m - 0 is our relative operator'],
    ['s', 'uShadeStrength', 0, 2, 0.01, 'sun term'],
    ['s', 'uSlopeShade', 0, 2, 0.01, 'sun-independent slope term'],
    ['s', 'uAmbient', 0, 1, 0.01, 'light on a slope facing away'],
    ['s', 'uRidgeInkStrength', 0, 20, 0.1, 'crest ink drawn by the surface pass'],
    ['s', 'uRidgeInkSpan', 20, 400, 10, 'crest span, m'],
    ['s', 'uRidgeInkThreshold', 0, 0.5, 0.005, 'crest threshold']
  ];
  const panel = document.getElementById('panel');
  const link = document.createElement('a');
  const setParam = (scope, name, value) => {
    if (scope === 'ink') { globalThis.ink(name, value); } else { globalThis.surface(name, value); }
  };
  const refreshLink = () => {
    const next = new URLSearchParams(query);
    for (const [scope, name] of CONTROLS) {
      next.set(scope + '.' + name, String(scope === 'ink' ? INK[name] : SURFACE[name]));
    }
    next.set('elevation', String(Math.round(eyeMetres)));
    link.href = location.pathname + '?' + next.toString();
    link.textContent = 'link to this look';
  };
  const slider = (parent, label, value, min, max, step, onInput) => {
    const wrap = document.createElement('label');
    wrap.textContent = label;
    const row = document.createElement('div');
    row.className = 'row';
    const input = document.createElement('input');
    Object.assign(input, { type: 'range', min, max, step, value });
    const readout = document.createElement('span');
    readout.className = 'val';
    readout.textContent = String(value);
    input.addEventListener('input', () => {
      const next = parseFloat(input.value);
      readout.textContent = String(next);
      onInput(next);
      refreshLink();
    });
    row.append(input, readout);
    wrap.append(row);
    parent.append(wrap);
    return input;
  };
  // The eye first: it is the control a panorama is actually about, and the one the app exposes.
  const eyeHead = document.createElement('h4');
  eyeHead.textContent = 'viewpoint';
  panel.append(eyeHead);
  slider(panel, 'elevation, m above ground', eyeMetres, 0, 4000, 10, setEye);
  slider(panel, 'field of view', num('fov', 46), 5, 120, 1, setFov);
  // Their pitch cannot be set from outside - only setPosition and setAzimuth are on their window -
  // so the vertical is matched from OUR side. Measured at this viewpoint their skyline sits about
  // 20 px of 470 higher than ours at tilt 4, which at a 24 degree vertical field of view is ~1 deg.
  slider(panel, 'tilt', lastTilt, -10, 30, 0.25, (next) => setCamera(lastRotation, next));
  let section = '';
  for (const [scope, name, min, max, step, hint] of CONTROLS) {
    const head = scope === 'ink' ? 'outline (post-process)' : 'surface (shading)';
    if (head !== section) {
      section = head;
      const title = document.createElement('h4');
      title.textContent = head;
      panel.append(title);
    }
    const value = scope === 'ink' ? INK[name] : SURFACE[name];
    slider(panel, name + ' - ' + hint, value, min, max, step, (next) => setParam(scope, name, next));
  }
  panel.append(link);
  refreshLink();

  const hud = document.getElementById('hud');
  const logView = document.getElementById('log');
  const tick = () => {
    try {
      hud.textContent = `zoom ${camera.zoom.toFixed(2)}  rot ${camera.rotation.toFixed(1)}  tilt ${camera.tilt.toFixed(1)}\n` +
        `focus ${camera.focusPos.map((v) => v.toFixed(5)).join(', ')}\ndebug ${INK.uDebugView}`;
    } catch (error) {
      hud.textContent = String(error?.message ?? error);
    }
    // Only the tail, and only what a diagnosis needs: a shader that failed, a tile that did not load.
    const net = globalThis.__net;
    logView.textContent = `NET ${net.count} ${JSON.stringify(net.byHost)} ${JSON.stringify(net.status)}\n` +
      net.last.join('\n') + '\n---\n' + globalThis.__log.slice(-400).join('\n');
    requestAnimationFrame(tick);
  };
  tick();
</script>
